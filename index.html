<head>

  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/MonadABXY/mona-font/web/mona.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <style>
    :root {
      color-scheme: dark;
      --ink: #ffffff;
      --muted: #98989f;
      --paper: #1a1a1c;
      --panel: rgba(28, 28, 30, .9);
      --card: #2c2c2e;
      --chip: #3a3a3c;
      --uline: rgba(236, 225, 203, .9);
      --line: rgba(255, 255, 255, .08);
      --beige: #ece1cb;
      --beige-ink: #2b2416;
      --star: #ffd60a;
      --kakao: #fee500;
    }
    /* 픽셀 계단컷 모서리 (작은 요소용) */
    .pxcut-sm { border-radius: 0 !important; clip-path: polygon(
      0 4px, 4px 4px, 4px 0, calc(100% - 4px) 0, calc(100% - 4px) 4px, 100% 4px,
      100% calc(100% - 4px), calc(100% - 4px) calc(100% - 4px), calc(100% - 4px) 100%,
      4px 100%, 4px calc(100% - 4px), 0 calc(100% - 4px)); }
    /* 픽셀 강조체 — 타이틀 전용 */
    .px { font-family: 'Mona12', monospace; -webkit-font-smoothing: none; font-smooth: never; letter-spacing: 0; }
    /* 픽셀 이모지 (Mona12 내장) */
    .emo { font-family: "Mona12 Color Emoji", "Mona12 Emoji", sans-serif; -webkit-font-smoothing: none;
      font-smooth: never; font-size: 12px; line-height: 1; vertical-align: -1px; display: inline-block; }
    .emo.lg { font-size: 48px; }
    .emo.seek { animation: seek 2.6s steps(1, end) infinite; }
    @keyframes seek { 0%, 100% { transform: translate(-7px, 1px); } 25% { transform: translate(0, -4px); }
      50% { transform: translate(7px, 1px); } 75% { transform: translate(0, 3px); } }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body, body * { touch-action: manipulation; }   /* 더블탭 확대 방지 (핀치 확대는 유지) */
    #map-wrap, #map-wrap * { touch-action: none; }  /* 지도 위 제스처는 지도가 전담 — 페이지 스크롤 안 섞임 */
    body { font-family: "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", sans-serif; color: var(--ink); background: var(--paper); }
    button, input { font: inherit; }
    .hidden { display: none !important; }

    /* ── 모바일 레이아웃: 탑바 + 지도 + 콘텐츠 ── */
    .topbar { position: sticky; top: 0; z-index: 900;
      padding: calc(env(safe-area-inset-top) + 12px) 18px 12px; background: var(--panel);
      backdrop-filter: blur(24px) saturate(1.4); -webkit-backdrop-filter: blur(24px) saturate(1.4); }
    .topbar-in { display: flex; align-items: center; gap: 9px; max-width: 394px; margin: 0 auto; }
    .topbar .brand { display: flex; align-items: center; gap: 8px; flex: 1; font-size: 15px; font-weight: 800; letter-spacing: -.02em; }
    .topbar .jb-char { image-rendering: pixelated; }
    .beta-chip { margin-left: 2px; padding: 4px 9px; border-radius: 999px; background: rgba(236,225,203,.13);
      color: var(--beige); font-size: 10px; font-weight: 800; letter-spacing: .02em; }
    .who { color: var(--muted); font-size: 12.5px; font-weight: 600; }
    .ic-btn { border: 0; background: var(--card); border-radius: 11px; padding: 8px 9px; cursor: pointer; color: var(--ink); transition: color .15s; display: grid; place-items: center; }
    .ic-btn:hover { color: var(--beige); }
    .ic-btn svg { width: 18px; height: 18px; display: block; }
    #map-wrap { position: relative; height: 34vh; min-height: 230px; width: min(394px, calc(100% - 36px));
      margin: 12px auto 0; border-radius: 20px; overflow: hidden; transform: translateZ(0); isolation: isolate; }
    #map-wrap { transition: height .3s ease; }
    #map-wrap.tall { height: 60vh; }
    .map-size { position: absolute; right: 12px; bottom: 12px; z-index: 470; width: 40px; height: 40px; border: 0;
      border-radius: 50%; background: rgba(26,26,28,.92); color: var(--beige); display: grid; place-items: center;
      cursor: pointer; box-shadow: 0 6px 16px rgba(0,0,0,.35); }
    .map-size svg { width: 17px; height: 17px; display: block; }
    .map-size .ic-shrink, #map-wrap.tall .map-size .ic-grow { display: none; }
    #map-wrap.tall .map-size .ic-shrink { display: block; }
    .modal { position: fixed; inset: 0; z-index: 1000; background: rgba(0,0,0,.62); display: flex;
      align-items: center; justify-content: center; padding: 26px; }
    .modal-card { width: 100%; max-width: 340px; background: var(--card); border-radius: 20px; padding: 24px; }
    .modal-card h3 { margin: 0 0 18px; font-size: 16px; font-weight: 800; letter-spacing: -.02em; }
    .modal-card .uline { font-size: 22px; }
    .modal-btns { display: flex; gap: 10px; margin-top: 22px; }
    .modal-btns button { flex: 1; padding: 14px; border: 0; border-radius: 999px; font-weight: 800; font-size: 14px;
      cursor: pointer; font-family: inherit; }
    .modal-btns .m-cancel { background: var(--chip); color: var(--ink); }
    .modal-btns .m-save { background: var(--beige); color: var(--beige-ink); }
    .map-search { position: absolute; left: 12px; top: 12px; right: 64px; z-index: 470; }
    .search-box { position: relative; }
    .map-search input { width: 100%; border: 0; border-radius: 999px; padding: 11px 40px 11px 17px;
      background: rgba(26,26,28,.94); color: var(--ink); font-size: 16px; font-weight: 600;
      box-shadow: 0 6px 16px rgba(0,0,0,.3); }
    .search-clear { position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
      width: 30px; height: 30px; border: 0; border-radius: 50%; background: var(--chip);
      color: var(--muted); font-size: 13px; line-height: 1; cursor: pointer; display: grid; place-items: center; }
    .map-search input:focus { outline: 1.5px solid rgba(236,225,203,.5); }
    .map-search input::placeholder { color: #7d7d84; }
    .search-results { margin-top: 8px; display: grid; gap: 4px; max-height: 210px; overflow-y: auto; }
    .search-results button { border: 0; border-radius: 13px; padding: 11px 14px; background: rgba(26,26,28,.96);
      color: var(--ink); text-align: left; cursor: pointer; font-family: inherit; box-shadow: 0 4px 12px rgba(0,0,0,.25); }
    .search-results .rn { display: block; font-size: 13px; font-weight: 700; }
    .search-results .ra { display: block; margin-top: 2px; font-size: 11px; color: var(--muted); }
    .loc-btn { position: absolute; right: 12px; top: 12px; z-index: 470; width: 44px; height: 44px; border: 0;
      border-radius: 50%; background: rgba(26,26,28,.92); color: var(--beige); display: grid; place-items: center;
      cursor: pointer; box-shadow: 0 6px 16px rgba(0,0,0,.35); }
    .loc-btn svg { width: 20px; height: 20px; display: block; }
    .loc-btn.busy svg { animation: sp 1s linear infinite; }
    #map { position: absolute; inset: 0; background: #e9e2d6; }
    .map-note { position: absolute; z-index: 450; left: 12px; top: 12px; padding: 8px 12px; border-radius: 11px;
      background: var(--panel); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      font-size: 12px; font-weight: 700; box-shadow: 0 6px 20px rgba(0,0,0,.3); }
    main { max-width: 430px; margin: 0 auto; padding: 16px 18px calc(env(safe-area-inset-bottom) + 110px); display: grid; gap: 14px; overflow-x: clip; }

    /* ── PC 홈: 좌측 콘텐츠 470px + 우측 전체 지도 ── */
    @media (min-width: 900px) {
      body:not(.login-mode):not(.setup-mode):not(.settings-mode) {
        display: grid; grid-template-columns: 470px minmax(0, 1fr); grid-template-rows: auto 1fr; height: 100vh;
      }
      body:not(.login-mode):not(.setup-mode):not(.settings-mode) .topbar { grid-column: 1; grid-row: 1; }
      body:not(.login-mode):not(.setup-mode):not(.settings-mode) #map-wrap {
        grid-column: 2; grid-row: 1 / 3; width: auto; height: 100vh; min-height: 0;
        margin: 0; border-radius: 0; }
      body:not(.login-mode):not(.setup-mode):not(.settings-mode) main {
        grid-column: 1; grid-row: 2; overflow-y: auto; width: 100%; max-width: none;
        padding: 16px 38px calc(env(safe-area-inset-bottom) + 96px); }
      body:not(.login-mode):not(.setup-mode):not(.settings-mode) .map-size { display: none; }
      body:not(.login-mode):not(.setup-mode):not(.settings-mode) .fab { left: 235px; }
    }

    /* ── 카드 공통 ── */
    .card { padding: 20px; border-radius: 20px; background: var(--card); }
    .kicker { color: var(--muted); font-size: 11.5px; font-weight: 700; letter-spacing: .02em; line-height: 1.6; }
    .muted { color: var(--muted); }

    /* ── 로그인 뷰 (풀스크린 센터) ── */
    body.login-mode .topbar, body.login-mode #map-wrap, body.login-mode .fab { display: none; }
    body.login-mode main { display: flex; min-height: 100dvh; padding-top: 0; padding-bottom: 6px; }
    #login-view { flex: 1; display: flex; flex-direction: column; align-items: center; text-align: center;
      padding: calc(env(safe-area-inset-top) + 52px) 12px 6px; }
    .login-brand { font-size: 13px; font-weight: 800; letter-spacing: .02em; color: var(--muted); }
    .login-brand .lb-beta { font-style: normal; margin-left: 3px; padding: 2px 7px; border-radius: 999px;
      background: rgba(236,225,203,.13); color: var(--beige); font-size: 9.5px; letter-spacing: .06em; vertical-align: 1px; }
    #login-view .jb-char { width: 96px; height: 96px; margin-top: 0; image-rendering: pixelated; animation: bob 1.4s steps(1, end) infinite; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    .jb-char .lid { opacity: 0; animation: blink 4.6s linear infinite; }
    @keyframes blink { 0%, 91.5%, 96.5%, 100% { opacity: 0; } 92.5%, 95.5% { opacity: 1; } }
    #login-view h2 { margin: 0; font-size: 36px; font-weight: 700; line-height: 1.15; }
    .title-group { margin-top: 20px; display: flex; flex-direction: column; align-items: center; gap: 11px; }
    .expand { display: inline-block; background: rgba(236, 225, 203, .13); color: var(--beige);
      padding: 8px 14px; border-radius: 999px; font-weight: 700; font-size: 14px; line-height: 1.35; white-space: nowrap; }
    #login-view h2 .beige { color: var(--beige); }
    #login-view p { margin: 26px 0 0; color: var(--muted); font-size: 13.5px; line-height: 1.65; }
    .login-grow { flex: 1; }
    #kakao-login { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; max-width: 280px;
      padding: 16px; border: 0; border-radius: 999px; background: var(--kakao); color: #191600;
      font-weight: 700; font-size: 15px; letter-spacing: -.02em; cursor: pointer; }
    #kakao-login svg { width: 18px; height: 18px; flex: none; }
    .login-foot { margin-top: 13px; font-size: 11.5px; color: var(--muted); line-height: 1.5; }
    .a2hs { margin-top: 18px; padding: 9px 15px; border-radius: 999px; background: rgba(236,225,203,.07);
      font-size: 11px; color: #7d7d84; line-height: 1.6; }
    .a2hs:empty { display: none; }
    .a2hs b { color: var(--beige); font-weight: 700; }
    .a2hs svg { width: 12px; height: 12px; vertical-align: -2px; display: inline-block; }

    /* ── 온보딩 위저드 (setup-mode: 풀스크린) ── */
    body.setup-mode { display: flex; flex-direction: column; min-height: 100dvh; }
    body.setup-mode .topbar, body.setup-mode .fab { display: none; }
    body.setup-mode main { order: 1; flex: 0 0 auto; display: block; width: 100%; max-width: 430px;
      margin: 0 auto; overflow: visible;
      padding: calc(env(safe-area-inset-top) + 26px) 26px 0; }
    body.setup-mode #map-wrap { order: 2; flex: 1 1 auto; width: 100%; max-width: 430px; margin: 20px auto 0;
      height: auto; min-height: 260px; border-radius: 20px; overflow: hidden; }
    body.setup-mode.no-map #map-wrap { display: none; }
    body.setup-mode.no-map main { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }
    body.setup-mode.no-map #wiz-view { flex: 1; display: flex; flex-direction: column; min-height: 0; }
    #setup-foot { display: none; }
    body.setup-mode #setup-foot { order: 3; display: block; width: 100%; max-width: 430px;
      margin: 0 auto; padding: 16px 26px calc(env(safe-area-inset-bottom) + 26px); }
    /* 진행 라인 · 뒤로가기 */
    .wiz-prog { position: fixed; left: 0; right: 0; top: 0; height: 2px; background: rgba(255,255,255,.07); z-index: 950; }
    .wiz-prog i { display: block; height: 100%; background: var(--beige); width: 20%;
      transition: width .35s cubic-bezier(.4, 0, .2, 1); }
    .wiz-head { display: flex; align-items: center; justify-content: space-between; margin: 0 0 22px; }
    .wiz-head .wiz-back { margin: 0 0 0 -2px; }
    .wiz-head .wiz-close { margin: 0 -2px 0 0; padding: 8px 0 8px 8px; }
    .wiz-back { border: 0; background: none; cursor: pointer; padding: 8px 8px 8px 0; margin: 0 0 22px -2px;
      color: var(--muted); transition: color .15s; }
    .wiz-back:hover { color: var(--beige); }
    .wiz-back svg { display: block; width: 26px; height: 26px; image-rendering: pixelated; shape-rendering: crispEdges; }
    .wiz-back.hide { visibility: hidden; }
    /* 질문 */
    .wiz h2 { margin: 0; font-size: 30px; font-weight: 700; line-height: 1.4; }
    .wiz h2 .b { color: var(--beige); display: block; }
    .wiz-sub { margin: 16px 0 0; color: var(--muted); font-size: 13.5px; line-height: 1.65; letter-spacing: -.01em; }
    .wiz-body { margin-top: 44px; }
    body.setup-mode.no-map .wiz-body { flex: 1; display: flex; flex-direction: column; }
    /* 밑줄 입력 */
    .uline { width: 100%; border: 0; border-bottom: 1.5px solid var(--uline); background: none; color: var(--ink);
      padding: 6px 2px 12px; font-size: 26px; font-weight: 700; letter-spacing: -.03em; font-family: inherit; }
    .uline:focus { outline: none; border-bottom-color: #fff; }
    .uline::placeholder { color: #5c5c62; font-weight: 600; }
    .uline.dup { border-bottom-color: #ff6b5e; }
    .dup-msg { display: none; margin: 9px 0 0; color: #ff6b5e; font-size: 12px; font-weight: 700; }
    .dup-msg.on { display: block; }
    .picks { display: flex; gap: 20px; margin-top: 22px; }
    .pick { border: 0; background: none; color: var(--muted); font-size: 14px; font-weight: 600; cursor: pointer; padding: 0; }
    .pick.on { color: var(--beige); font-weight: 800; }
    .wiz-hint { margin-top: auto; color: #63636a; font-size: 12px; line-height: 1.6; padding-bottom: 6px; }
    /* 세그먼트 */
    .seg { display: flex; width: 100%; margin-top: 10px; background: var(--card); border-radius: 999px; padding: 4px; gap: 4px; }
    .seg button { flex: 1; min-width: 0; border: 0; border-radius: 999px; padding: 15px 0; background: none;
      color: var(--muted); font-size: 14.5px; font-weight: 700; letter-spacing: -.02em; cursor: pointer;
      transition: .16s; font-family: inherit; }
    .seg button.on { background: var(--beige); color: var(--beige-ink); font-weight: 800; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
    .flabel { margin-top: 30px; color: var(--muted); font-size: 11.5px; font-weight: 800; letter-spacing: .07em; }
    /* 시각 입력 */
    .time-row { display: flex; width: 100%; gap: 10px; align-items: stretch; margin-top: 10px; }
    .time-wrap { position: relative; flex: 1; min-width: 0; display: flex; }
    .time-hint { position: absolute; right: 18px; top: 50%; transform: translateY(-50%);
      color: #5c5c62; font-size: 13px; font-weight: 600; pointer-events: none; }
    @media (hover: hover) and (pointer: fine) { .time-hint { display: none !important; } }  /* PC는 브라우저 자체 표시(--:--)가 있음 */
    .time-row input[type=time] { flex: 1; min-width: 0; border: 0; border-radius: 14px; background: var(--card);
      color: var(--ink); padding: 16px 18px; font-size: 22px; font-weight: 700; font-family: inherit; letter-spacing: -.02em; }
    .time-row input[type=time]:focus { outline: 2px solid rgba(236,225,203,.45); }
    .time-row input[type=time]::-webkit-calendar-picker-indicator { filter: invert(1) brightness(2); opacity: .9;
      cursor: pointer; width: 22px; height: 22px; padding: 2px; }
    .time-add { flex: none; border: 0; border-radius: 999px; padding: 0 22px; background: var(--chip); color: var(--ink);
      font-weight: 700; font-size: 15px; letter-spacing: -.02em; cursor: pointer; font-family: inherit; transition: .15s; }
    .time-add:disabled { opacity: .4; cursor: default; }
    .time-add:not(:disabled) { background: var(--beige); color: var(--beige-ink); font-weight: 800; }
    .mts { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 16px; }
    .mt { display: inline-flex; align-items: center; gap: 10px; padding: 11px 15px; border-radius: 999px;
      background: rgba(236,225,203,.22); border: 1px solid rgba(236,225,203,.42); color: var(--beige);
      font-size: 14px; font-weight: 700; letter-spacing: -.01em; }
    .mt b { font-weight: 800; color: #fff; }
    .mt button { border: 0; background: none; color: var(--beige); opacity: .65; cursor: pointer;
      padding: 2px 0 2px 2px; font-size: 13px; }
    /* 지도 위 고정 핀 · 캡션 */
    .center-pin { position: absolute; left: 50%; top: 50%; z-index: 460; width: 32px; height: 32px;
      border-radius: 50% 50% 50% 7px; background: var(--beige-ink); border: 3.5px solid var(--beige);
      transform: translate(-50%, -100%) rotate(-45deg); box-shadow: 0 8px 18px rgba(0,0,0,.32); pointer-events: none; }
    .center-pin span { display: block; transform: rotate(45deg); text-align: center; line-height: 25px; font-size: 13px; }
    .map-cap { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 460; white-space: nowrap;
      background: rgba(26,26,28,.9); border-radius: 999px; padding: 9px 15px; font-size: 12.5px; font-weight: 600;
      pointer-events: none; max-width: calc(100% - 28px); overflow: hidden; text-overflow: ellipsis; }
    /* CTA */
    .wiz-cta { width: 100%; padding: 18px; border: 0; border-radius: 999px; background: var(--beige);
      color: var(--beige-ink); font-weight: 800; font-size: 15.5px; letter-spacing: -.02em; cursor: pointer; font-family: inherit; }
    .wiz-cta:disabled { opacity: .5; cursor: default; }

    /* ── 홈: 예고 · 잠김 · 히어로 ── */
    .next-tease { display: flex; align-items: center; gap: 8px; justify-content: center; padding: 12px;
      border-radius: 999px; background: var(--card); color: var(--muted); font-size: 12.5px; font-weight: 600; }
    .locked { text-align: center; padding: 44px 20px; }

    .peek.animating { transition: transform .22s cubic-bezier(.3,.7,.4,1), opacity .22s; }
    .peek h3 { margin: 0; font-size: 24px; font-weight: 400; color: var(--ink); text-align: center; padding: 0 24px; word-break: keep-all; }

    .hero small { color: var(--muted); font-size: 12px; font-weight: 600; }
    .hero-title { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 18px 0 8px; }
    .hero h2 { margin: 0; font-size: 30px; font-weight: 700; line-height: 1.35; letter-spacing: 0; word-break: keep-all; overflow-wrap: anywhere; text-wrap: balance; }
    .cat-ic { flex: none; width: 64px; height: 64px; display: block; }
    .cat-ic svg { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
    /* ── 카테고리 아이콘 모션 (모선) ── */
    /* 스팀 (라멘·국물·백반) — 3프레임 지그재그, 2.8s */
      .cat-ic .st1 { animation: catic-st1 2.8s steps(1,end) infinite; animation-delay: var(--d, 0s); }
      .cat-ic .st2 { animation: catic-st2 2.8s steps(1,end) infinite; animation-delay: var(--d, 0s); }
      .cat-ic .st3 { animation: catic-st3 2.8s steps(1,end) infinite; animation-delay: var(--d, 0s); }
      @keyframes catic-st1 { 0% {opacity:1} 25% {opacity:0} 100% {opacity:0} }
      @keyframes catic-st2 { 0% {opacity:0} 50% {opacity:1} 75% {opacity:0} 100% {opacity:0} }
      @keyframes catic-st3 { 0% {opacity:0} 25% {opacity:1} 50% {opacity:0} 75% {opacity:1} 100% {opacity:1} }
      /* 불꽃 (중식) — 3프레임 플리커, 1.8s */
      .cat-ic .fl1 { animation: catic-fl1 1.8s steps(1,end) infinite; }
      .cat-ic .fl2 { animation: catic-fl2 1.8s steps(1,end) infinite; }
      .cat-ic .fl3 { animation: catic-fl3 1.8s steps(1,end) infinite; }
      @keyframes catic-fl1 { 0% {opacity:1} 33.4% {opacity:0} 100% {opacity:0} }
      @keyframes catic-fl2 { 0% {opacity:0} 33.4% {opacity:1} 66.7% {opacity:0} 100% {opacity:0} }
      @keyframes catic-fl3 { 0% {opacity:0} 66.7% {opacity:1} 100% {opacity:1} }
      /* 지글 (고기) — 하이라이트 자리바꿈 + 기름 피어오름 픽셀, 2.8s */
      .cat-ic .hlA { animation: catic-hlA 2.8s steps(1,end) infinite; }
      .cat-ic .hlB { animation: catic-hlB 2.8s steps(1,end) infinite; }
      .cat-ic .szA { animation: catic-szA 2.8s steps(1,end) infinite; }
      .cat-ic .szB { animation: catic-szB 2.8s steps(1,end) infinite; }
      @keyframes catic-hlA { 0% {opacity:1} 50% {opacity:0} 100% {opacity:0} }
      @keyframes catic-hlB { 0% {opacity:0} 50% {opacity:1} 100% {opacity:1} }
      @keyframes catic-szA { 0% {opacity:0} 30% {opacity:1} 41% {opacity:0} 100% {opacity:0} }
      @keyframes catic-szB { 0% {opacity:0} 75% {opacity:1} 86% {opacity:0} 100% {opacity:0} }
      /* 딥 (면) — 젓가락+면발이 1픽셀 담겼다 올라옴, 3.6s 중 430ms */
      .cat-ic .lift { animation: catic-dip 3.6s steps(1,end) infinite; }
      @keyframes catic-dip { 0% {transform:translateY(0)} 76% {transform:translateY(1px)} 88% {transform:translateY(0)} 100% {transform:translateY(0)} }
      /* 글린트 (커틀릿) — 튀김옷 윤기 1픽셀이 좌→우 3스텝 스윕, 3.2s 중 580ms */
      .cat-ic .glint { animation: catic-glint 3.2s steps(1,end) infinite; }
      @keyframes catic-glint {
        0% {transform:translateX(0); opacity:1}
        6% {transform:translateX(3px)}
        12% {transform:translateX(6px)}
        18% {opacity:0}
        100% {transform:translateX(6px); opacity:0}
      }
      /* 보글 (떡볶이) — 밝은 소스 픽셀 2개가 번갈아 퐁, 2.4s */
      .cat-ic .bbA { animation: catic-bbA 2.4s steps(1,end) infinite; }
      .cat-ic .bbB { animation: catic-bbB 2.4s steps(1,end) infinite; }
      @keyframes catic-bbA { 0% {opacity:0} 10% {opacity:1} 25% {opacity:0} 100% {opacity:0} }
      @keyframes catic-bbB { 0% {opacity:0} 60% {opacity:1} 75% {opacity:0} 100% {opacity:0} }
      /* 모션 최소화 환경 — 전부 정지 (기본 상태 = 기존 정적 아이콘과 동일) */
      @media (prefers-reduced-motion: reduce) {
        .cat-ic .st1, .cat-ic .st2, .cat-ic .st3,
        .cat-ic .fl1, .cat-ic .fl2, .cat-ic .fl3,
        .cat-ic .hlA, .cat-ic .hlB, .cat-ic .szA, .cat-ic .szB,
        .cat-ic .lift, .cat-ic .glint, .cat-ic .bbA, .cat-ic .bbB { animation: none; }
      }
    .hero .menu-line { margin: 0; color: var(--muted); font-weight: 600; font-size: 14px; }

    .star-label { margin-left: 8px; font-size: 12px; color: var(--muted); font-weight: 700; }

    /* ── 다녀온 곳 ── */

    @keyframes sp { to { transform: rotate(360deg); } }

th=\"1\" height=\"1\" fill=\"#cfd6dd\"/><rect x=\"6\" y=\"1\" width=\"1\" height=\"1\" fill=\"#cfd6dd\"/><rect x=\"5\" y=\"0\" width=\"1\" height=\"1\" fill=\"#cfd6dd\"/><rect x=\"10\" y=\"2\" width=\"1\" height=\"1\" fill=\"#cfd6dd\"/><rect x=\"11\" y=\"1\" width=\"1\" height=\"1\" fill=\"#cfd6dd\"/><rect x=\"10\" y=\"0\" width=\"1\" height=\"1\" fill=\"#cfd6dd\"/></g><rect x=\"5\" y=\"5\" width=\"6\" height=\"1\" fill=\"#f4f6f8\"/><rect x=\"4\" y=\"6\" width=\"8\" height=\"1\" fill=\"#f4f6f8\"/><rect x=\"4\" y=\"5\" width=\"1\" height=\"1\" fill=\"#140e08\"/><rect x=\"11\" y=\"5\" width=\"1\" height=\"1\" fill=\"#140e08\"/><rect x=\"5\" y=\"4\" width=\"6\" height=\"1\" fill=\"#140e08\"/><rect x=\"3\" y=\"6\" width=\"1\" height=\"1\" fill=\"#140e08\"/><rect x=\"12\" y=\"6\" width=\"1\" height=\"1\" fill=\"#140e08\"/><rect x=\"3\" y=\"7\" width=\"10\" height=\"1\" fill=\"#ffffff\"/><rect x=\"2\" y=\"8\" width=\"12\" height=\"1\" fill=\"#140e08\"/><rect x=\"3\" y=\"9\" width=\"10\" height=\"2\" fill=\"#2f6bd8\"/><rect x=\"2\" y=\"9\" width=\"1\" height=\"2\" fill=\"#140e08\"/><rect x=\"13\" y=\"9\" width=\"1\" height=\"2\" fill=\"#140e08\"/><rect x=\"4\" y=\"11\" width=\"8\" height=\"1\" fill=\"#2f6bd8\"/><rect x=\"3\" y=\"11\" width=\"1\" height=\"1\" fill=\"#140e08\"/><rect x=\"12\" y=\"11\" width=\"1\" height=\"1\" fill=\"#140e08\"/><rect x=\"5\" y=\"12\" width=\"6\" height=\"1\" fill=\"#140e08\"/></svg>", "면": "<svg viewBox=\"0 0 16 16\" shape-rendering=\"crispEdges\"><g class=\"lift\"><rect x=\"11\" y=\"0\" width=\"1\" height=\"1\" fill=\"#8a5a34\"/><rect x=\"12\" y=\"0\" width=\"1\" height=\"1\" fill=\"#8a5a34\"/><rect x=\"10\" y=\"1\" width=\"1\" height=\"1\" fill=\"#8a5a34\"/><rect x=\"11\" y=\"1\" width=\"1\" height=\"1\" fill=\"#8a5a34\"/><rect x=\"9\" y=\"2\" width=\"1\" height=\"1\" fill=\"#8a5a34\"/><rect x=\"10\" y=\"2\" width=\"1\" height=\"1\" fill=\"#8a5a34\"/><rect x=\"5\" y=\"3\" width=\"1\" height=\"5\" fill=\"#ffd66b\"/><rect x=\"7\" y=\"3\" widt
