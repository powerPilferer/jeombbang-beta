<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>점빵이 — 뭐먹정</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2096%2072%22%20width%3D%2232%22%20height%3D%2224%22%20shape-rendering%3D%22crispEdges%22%3E%3Cg%20fill%3D%22%23ece1cb%22%3E%3Crect%20x%3D%2232%22%20y%3D%228%22%20width%3D%2232%22%20height%3D%2216%22%2F%3E%3C%2Fg%3E%3Cg%20fill%3D%22%23f7b731%22%3E%3Crect%20x%3D%228%22%20y%3D%2232%22%20width%3D%2280%22%20height%3D%2224%22%2F%3E%3Crect%20x%3D%2224%22%20y%3D%2256%22%20width%3D%2248%22%20height%3D%228%22%2F%3E%3C%2Fg%3E%3Cg%20fill%3D%22%23ffffff%22%3E%3Crect%20x%3D%2224%22%20y%3D%2240%22%20width%3D%228%22%20height%3D%2216%22%2F%3E%3Crect%20x%3D%2264%22%20y%3D%2240%22%20width%3D%228%22%20height%3D%2216%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E">
  <meta name="theme-color" content="#1a1a1c">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/MonadABXY/mona-font/web/mona.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <style>
    :root {
      color-scheme: dark;
      --ink: #ffffff;
      --muted: #98989f;
      --paper: #1a1a1c;
      --panel: rgba(28, 28, 30, .9);
      --card: #2c2c2e;
      --chip: #3a3a3c;
      --uline: rgba(236, 225, 203, .9);
      --line: rgba(255, 255, 255, .08);
      --beige: #ece1cb;
      --beige-ink: #2b2416;
      --star: #ffd60a;
      --kakao: #fee500;
    }
    /* 픽셀 계단컷 모서리 (작은 요소용) */
    .pxcut-sm { border-radius: 0 !important; clip-path: polygon(
      0 4px, 4px 4px, 4px 0, calc(100% - 4px) 0, calc(100% - 4px) 4px, 100% 4px,
      100% calc(100% - 4px), calc(100% - 4px) calc(100% - 4px), calc(100% - 4px) 100%,
      4px 100%, 4px calc(100% - 4px), 0 calc(100% - 4px)); }
    /* 픽셀 강조체 — 타이틀 전용 */
    .px { font-family: 'Mona12', monospace; -webkit-font-smoothing: none; font-smooth: never; letter-spacing: 0; }
    /* 픽셀 이모지 (Mona12 내장) */
    .emo { font-family: "Mona12 Color Emoji", "Mona12 Emoji", sans-serif; -webkit-font-smoothing: none;
      font-smooth: never; font-size: 12px; line-height: 1; vertical-align: -1px; display: inline-block; }
    .emo.lg { font-size: 48px; }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body { font-family: "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", sans-serif; color: var(--ink); background: var(--paper); }
    button, input { font: inherit; }
    .hidden { display: none !important; }

    /* ── 모바일 레이아웃: 탑바 + 지도 + 콘텐츠 ── */
    .topbar { position: sticky; top: 0; z-index: 900; display: flex; align-items: center; gap: 9px;
      padding: calc(env(safe-area-inset-top) + 12px) 18px 12px; background: var(--panel);
      backdrop-filter: blur(24px) saturate(1.4); -webkit-backdrop-filter: blur(24px) saturate(1.4); }
    .topbar .brand { display: flex; align-items: center; gap: 8px; flex: 1; font-size: 15px; font-weight: 800; letter-spacing: -.02em; }
    .topbar .jb-char { image-rendering: pixelated; animation: bob 1.4s steps(1, end) infinite; }
    .who { color: var(--muted); font-size: 12.5px; font-weight: 600; }
    .ic-btn { border: 0; background: var(--card); border-radius: 11px; padding: 8px 9px; cursor: pointer; color: var(--ink); transition: color .15s; display: grid; place-items: center; }
    .ic-btn:hover { color: var(--beige); }
    .ic-btn svg { width: 18px; height: 18px; display: block; }
    #map-wrap { position: relative; height: 34vh; min-height: 230px; width: min(394px, calc(100% - 36px));
      margin: 12px auto 0; border-radius: 20px; overflow: hidden; }
    #map { width: 100%; height: 100%; background: #e9e2d6; }
    .map-note { position: absolute; z-index: 450; left: 12px; top: 12px; padding: 8px 12px; border-radius: 11px;
      background: var(--panel); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      font-size: 12px; font-weight: 700; box-shadow: 0 6px 20px rgba(0,0,0,.3); }
    main { max-width: 430px; margin: 0 auto; padding: 16px 18px calc(env(safe-area-inset-bottom) + 96px); display: grid; gap: 14px; }

    /* ── 카드 공통 ── */
    .card { padding: 20px; border-radius: 20px; background: var(--card); }
    .kicker { color: var(--muted); font-size: 11.5px; font-weight: 700; letter-spacing: .02em; line-height: 1.6; }
    .muted { color: var(--muted); }

    /* ── 로그인 뷰 (풀스크린 센터) ── */
    body.login-mode .topbar, body.login-mode #map-wrap, body.login-mode .fab { display: none; }
    body.login-mode main { display: flex; min-height: 100dvh; padding-top: 0; padding-bottom: 6px; }
    #login-view { flex: 1; display: flex; flex-direction: column; align-items: center; text-align: center;
      padding: calc(env(safe-area-inset-top) + 52px) 12px 6px; }
    .login-brand { font-size: 13px; font-weight: 800; letter-spacing: .02em; color: var(--muted); }
    #login-view .jb-char { width: 128px; height: 128px; margin-top: 0; image-rendering: pixelated; animation: bob 1.4s steps(1, end) infinite; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    .jb-char .lid { opacity: 0; animation: blink 4.6s linear infinite; }
    @keyframes blink { 0%, 91.5%, 96.5%, 100% { opacity: 0; } 92.5%, 95.5% { opacity: 1; } }
    #login-view h2 { margin: 0; font-size: 48px; font-weight: 700; line-height: 1.15; }
    .title-group { margin-top: 24px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .expand { display: inline-block; background: rgba(236, 225, 203, .13); color: var(--beige);
      padding: 9px 16px; border-radius: 999px; font-weight: 700; font-size: 16px; line-height: 1.35; white-space: nowrap; }
    #login-view h2 .beige { color: var(--beige); }
    #login-view p { margin: 30px 0 0; color: var(--muted); font-size: 14px; line-height: 1.65; }
    .login-grow { flex: 1; }
    #kakao-login { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; max-width: 340px;
      padding: 16px; border: 0; border-radius: 999px; background: var(--kakao); color: #191600;
      font-weight: 700; font-size: 15px; letter-spacing: -.02em; cursor: pointer; }
    #kakao-login svg { width: 18px; height: 18px; flex: none; }
    .login-foot { margin-top: 13px; font-size: 11.5px; color: var(--muted); line-height: 1.5; }

    /* ── 온보딩 위저드 (setup-mode: 풀스크린) ── */
    body.setup-mode { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
    body.setup-mode .topbar, body.setup-mode .fab { display: none; }
    body.setup-mode main { order: 1; flex: 0 0 auto; display: block; width: 100%; max-width: 430px;
      margin: 0 auto; overflow: visible;
      padding: calc(env(safe-area-inset-top) + 26px) 26px 0; }
    body.setup-mode #map-wrap { order: 2; flex: 1 1 auto; width: 100%; max-width: 430px; margin: 20px auto 0;
      height: auto; min-height: 0; border-radius: 20px; overflow: hidden; }
    body.setup-mode.no-map #map-wrap { display: none; }
    body.setup-mode.no-map main { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }
    body.setup-mode.no-map #wiz-view { flex: 1; display: flex; flex-direction: column; min-height: 0; }
    #setup-foot { display: none; }
    body.setup-mode #setup-foot { order: 3; display: block; width: 100%; max-width: 430px;
      margin: 0 auto; padding: 0 26px calc(env(safe-area-inset-bottom) + 26px); }
    /* 진행 라인 · 뒤로가기 */
    .wiz-prog { position: fixed; left: 0; right: 0; top: 0; height: 2px; background: rgba(255,255,255,.07); z-index: 950; }
    .wiz-prog i { display: block; height: 100%; background: var(--beige); width: 20%;
      transition: width .35s cubic-bezier(.4, 0, .2, 1); }
    .wiz-back { border: 0; background: none; cursor: pointer; padding: 8px 8px 8px 0; margin: 0 0 22px -2px;
      color: var(--muted); transition: color .15s; }
    .wiz-back:hover { color: var(--beige); }
    .wiz-back svg { display: block; width: 26px; height: 26px; image-rendering: pixelated; shape-rendering: crispEdges; }
    .wiz-back.hide { visibility: hidden; }
    /* 질문 */
    .wiz h2 { margin: 0; font-size: 36px; font-weight: 700; line-height: 1.4; }
    .wiz h2 .b { color: var(--beige); display: block; }
    .wiz-sub { margin: 16px 0 0; color: var(--muted); font-size: 13.5px; line-height: 1.65; letter-spacing: -.01em; }
    .wiz-body { margin-top: 44px; }
    body.setup-mode.no-map .wiz-body { flex: 1; display: flex; flex-direction: column; }
    /* 밑줄 입력 */
    .uline { width: 100%; border: 0; border-bottom: 1.5px solid var(--uline); background: none; color: var(--ink);
      padding: 6px 2px 12px; font-size: 26px; font-weight: 700; letter-spacing: -.03em; font-family: inherit; }
    .uline:focus { outline: none; border-bottom-color: #fff; }
    .uline::placeholder { color: #5c5c62; font-weight: 600; }
    .uline.dup { border-bottom-color: #ff6b5e; }
    .dup-msg { display: none; margin: 9px 0 0; color: #ff6b5e; font-size: 12px; font-weight: 700; }
    .dup-msg.on { display: block; }
    .picks { display: flex; gap: 20px; margin-top: 22px; }
    .pick { border: 0; background: none; color: var(--muted); font-size: 14px; font-weight: 600; cursor: pointer; padding: 0; }
    .pick.on { color: var(--beige); font-weight: 800; }
    .wiz-hint { margin-top: auto; color: #63636a; font-size: 12px; line-height: 1.6; padding-bottom: 6px; }
    /* 세그먼트 */
    .seg { display: flex; width: 100%; margin-top: 10px; background: var(--card); border-radius: 999px; padding: 4px; gap: 4px; }
    .seg button { flex: 1; min-width: 0; border: 0; border-radius: 999px; padding: 15px 0; background: none;
      color: var(--muted); font-size: 14.5px; font-weight: 700; letter-spacing: -.02em; cursor: pointer;
      transition: .16s; font-family: inherit; }
    .seg button.on { background: var(--beige); color: var(--beige-ink); font-weight: 800; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
    .flabel { margin-top: 30px; color: var(--muted); font-size: 11.5px; font-weight: 800; letter-spacing: .07em; }
    /* 시각 입력 */
    .time-row { display: flex; width: 100%; gap: 10px; align-items: stretch; margin-top: 10px; }
    .time-row input[type=time] { flex: 1; min-width: 0; border: 0; border-radius: 14px; background: var(--card);
      color: var(--ink); padding: 16px 18px; font-size: 22px; font-weight: 700; font-family: inherit; letter-spacing: -.02em; }
    .time-row input[type=time]:focus { outline: 2px solid rgba(236,225,203,.45); }
    .time-row input[type=time]::-webkit-calendar-picker-indicator { filter: invert(1) brightness(2); opacity: .9;
      cursor: pointer; width: 22px; height: 22px; padding: 2px; }
    .time-add { flex: none; border: 0; border-radius: 999px; padding: 0 22px; background: var(--chip); color: var(--ink);
      font-weight: 700; font-size: 15px; letter-spacing: -.02em; cursor: pointer; font-family: inherit; }
    .mts { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 16px; }
    .mt { display: inline-flex; align-items: center; gap: 10px; padding: 11px 15px; border-radius: 999px;
      background: rgba(236,225,203,.22); border: 1px solid rgba(236,225,203,.42); color: var(--beige);
      font-size: 14px; font-weight: 700; letter-spacing: -.01em; }
    .mt b { font-weight: 800; color: #fff; }
    .mt button { border: 0; background: none; color: var(--beige); opacity: .65; cursor: pointer;
      padding: 2px 0 2px 2px; font-size: 13px; }
    /* 지도 위 고정 핀 · 캡션 */
    .center-pin { position: absolute; left: 50%; top: 50%; z-index: 460; width: 32px; height: 32px;
      border-radius: 50% 50% 50% 7px; background: var(--beige-ink); border: 3.5px solid var(--beige);
      transform: translate(-50%, -100%) rotate(-45deg); box-shadow: 0 8px 18px rgba(0,0,0,.32); pointer-events: none; }
    .center-pin span { display: block; transform: rotate(45deg); text-align: center; line-height: 25px; font-size: 13px; }
    .map-cap { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 460; white-space: nowrap;
      background: rgba(26,26,28,.9); border-radius: 999px; padding: 9px 15px; font-size: 12.5px; font-weight: 600;
      pointer-events: none; max-width: calc(100% - 28px); overflow: hidden; text-overflow: ellipsis; }
    /* CTA */
    .wiz-cta { width: 100%; padding: 18px; border: 0; border-radius: 999px; background: var(--beige);
      color: var(--beige-ink); font-weight: 800; font-size: 15.5px; letter-spacing: -.02em; cursor: pointer; font-family: inherit; }
    .wiz-cta:disabled { opacity: .5; cursor: default; }

    /* ── 홈: 예고 · 잠김 · 히어로 ── */
    .next-tease { display: flex; align-items: center; gap: 8px; justify-content: center; padding: 12px;
      border-radius: 999px; background: var(--card); color: var(--muted); font-size: 12.5px; font-weight: 600; }
    .locked { text-align: center; padding: 44px 20px; }
    .locked h2 { margin: 18px 0 0; font-size: 24px; font-weight: 700; line-height: 1.5; letter-spacing: 0; }
    .locked-sub { margin: 12px 0 0; color: var(--muted); font-size: 13px; font-weight: 600; }
    .hero-wrap { position: relative; }
    .hero { position: relative; z-index: 2; touch-action: pan-y; cursor: grab; will-change: transform; user-select: none; -webkit-user-select: none; }
    .hero.dragging { transition: none; }
    .hero.animating { transition: transform .22s cubic-bezier(.3,.7,.4,1), opacity .22s; }
    .no-more { position: absolute; inset: 0; z-index: 1; display: flex; align-items: center; justify-content: flex-end;
      padding-right: calc(16.6% - 28px); opacity: 0; transition: opacity .2s; pointer-events: none; }
    .no-more.left { justify-content: flex-start; padding-right: 0; padding-left: calc(16.6% - 28px); }
    .no-more .jb-char { width: 56px; height: 56px; image-rendering: pixelated; animation: bob 1.4s steps(1,end) infinite; }
    .peek { position: absolute; inset: 0; z-index: 1; border-radius: 20px; background: var(--card);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
      pointer-events: none; opacity: 0; transform: translateX(120%); }
    .peek.animating { transition: transform .22s cubic-bezier(.3,.7,.4,1), opacity .22s; }
    .peek h3 { margin: 0; font-size: 24px; font-weight: 400; color: var(--ink); text-align: center; padding: 0 24px; word-break: keep-all; }
    .peek .cat-ic { width: 48px; height: 48px; }
    .peek .peek-q { font-size: 48px; color: var(--beige); }
    .hero-kicker { display: flex; align-items: center; justify-content: space-between; }
    .badge { display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px; border-radius: 999px;
      background: rgba(236,225,203,.13); color: var(--beige); font-size: 12.5px; font-weight: 800; }
    .hero small { color: var(--muted); font-size: 12px; font-weight: 600; }
    .hero-title { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 18px 0 8px; }
    .hero h2 { margin: 0; font-size: 30px; font-weight: 700; line-height: 1.35; letter-spacing: 0; word-break: keep-all; overflow-wrap: anywhere; text-wrap: balance; }
    .cat-ic { flex: none; width: 64px; height: 64px; display: block; }
    .cat-ic svg { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
    .hero .menu-line { margin: 0; color: var(--muted); font-weight: 600; font-size: 14px; }
    .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 18px; }
    .fact { padding: 12px 8px; border-radius: 13px; background: var(--chip); text-align: center; }
    .fact strong, .fact span { display: block; }
    .fact strong { font-size: 14px; font-weight: 700; }
    .fact span { margin-top: 3px; color: var(--muted); font-size: 11px; }
    .go-map { width: 100%; margin-top: 16px; padding: 15px; border: 0; border-radius: 999px; color: var(--beige-ink);
      background: var(--beige); font-weight: 800; font-size: 14.5px; letter-spacing: -.02em; cursor: pointer; font-family: inherit; }
    .swipe-hint { width: 100%; margin-top: 12px; padding: 10px; color: var(--muted);
      font-size: 12.5px; font-weight: 700; user-select: none;
      display: flex; align-items: center; justify-content: center; gap: 8px; }
    .swipe-hint .arr { display: inline-block; line-height: 1; font-size: 17px; }
    #explore-req { width: 100%; margin-top: 13px; padding: 13px; border: 0; border-radius: 999px; background: var(--chip); color: var(--beige); font-weight: 700; cursor: pointer; font-family: inherit; }
    #explore-req:disabled { opacity: .6; }

    /* ── 상세 + 리뷰 ── */
    .detail h3 { margin: 6px 0 2px; font-size: 20px; font-weight: 800; letter-spacing: -.02em; word-break: keep-all; text-wrap: balance; }
    .detail .dmenu { margin: 0; color: var(--muted); font-weight: 600; font-size: 13.5px; }
    .menus { margin: 14px 0 0; display: grid; gap: 6px; }
    .mi { display: flex; justify-content: space-between; gap: 10px; padding: 10px 13px; border-radius: 11px; background: var(--chip); font-size: 13.5px; }
    .mi b { font-weight: 600; }
    .mi span { color: var(--muted); font-variant-numeric: tabular-nums; }
    .note { margin: 14px 0 0; padding-top: 12px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12.5px; line-height: 1.6; }
    .links { display: flex; gap: 16px; margin-top: 12px; flex-wrap: wrap; }
    .links a { font-weight: 700; font-size: 13px; text-decoration: none; }
    .links .tel { color: var(--beige); }
    .links .kakao { color: #fee500; }
    .links .naver { color: #03c75a; }
    .visits { margin-top: 14px; display: grid; gap: 7px; }
    .avg { display: flex; align-items: baseline; gap: 8px; font-weight: 800; font-size: 16px; color: var(--star); }
    .avg small { color: var(--muted); font-weight: 600; font-size: 11.5px; }
    .visit { padding: 11px 13px; border-radius: 11px; background: var(--chip); font-size: 12.5px; line-height: 1.55; }
    .visit b { color: var(--star); margin-right: 6px; letter-spacing: 1px; }
    .visit small { color: var(--muted); margin-left: 6px; }
    .who-chip { display: inline-block; margin-right: 7px; padding: 2px 9px; border-radius: 999px; background: #48484a; color: #fff; font-size: 10.5px; font-weight: 700; }
    .who-chip.me { background: var(--beige); color: var(--beige-ink); }
    .visit-btn { margin-top: 16px; width: 100%; padding: 13px; border: 1.5px solid rgba(236,225,203,.55); border-radius: 999px;
      color: var(--beige); background: none; font-weight: 800; cursor: pointer; font-family: inherit; font-size: 14px; transition: .15s; }
    .visit-btn:active { transform: scale(.985); }
    .vform { margin-top: 12px; padding: 16px; border-radius: 16px; background: #1c1c1e; display: none; gap: 10px; }
    .vform.on { display: grid; }
    .star-row { display: flex; align-items: center; gap: 2px; }
    .star { border: 0; background: none; padding: 5px 3px; font-size: 34px; line-height: 1; color: #6e6e73; cursor: pointer; }
    .star.on { color: var(--star); }
    .star.half { background: linear-gradient(90deg, var(--star) 50%, #6e6e73 50%); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .star-label { margin-left: 8px; font-size: 12px; color: var(--muted); font-weight: 700; }
    .vform textarea { border: 0; border-radius: 11px; padding: 11px 12px; font-size: 13px; resize: vertical; min-height: 54px;
      font-family: inherit; background: var(--chip); color: var(--ink); }
    .char-count { margin: -4px 4px 0 auto; font-size: 11px; color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
    .vsave { padding: 13px; border: 0; border-radius: 999px; background: var(--beige); color: var(--beige-ink); font-weight: 800; cursor: pointer; font-family: inherit; }

    /* ── 다녀온 곳 ── */
    .sec-title { display: flex; align-items: center; gap: 8px; margin: 14px 2px 0; padding-top: 24px; border-top: 1px solid rgba(255,255,255,.09); font-size: 15px; font-weight: 700; }
    .sec-title .n { display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 7px; border-radius: 999px;
      background: rgba(236,225,203,.16); color: var(--beige); font-size: 11.5px; font-weight: 800; }
    .vcard { width: 100%; display: flex; flex-direction: column; gap: 3px; padding: 14px 16px; border: 0; border-radius: 15px;

      '면': '<svg viewBox="0 0 16 16" shape-rendering="crispEdges"><rect x="11" y="0" width="1" height="1" fill="#8a5a34"/><rect x="12" y="0" width="1" height="1" fill="#8a5a34"/><rect x="10" y="1" width="1" height="1" fill="#8a5a34"/><rect x="11" y="1" width="1" height="1" fill="#8a5a34"/><rect x="9" y="2" width="1" height="1" fill="#8a5a34"/><rect x="10" y="2" width="1" height="1" fill="#8a5a34"/><rect x="5" y="3" width="1" height="5" fill="#ffd66b"/><rect x="7" y="3" width="1" height="5" fill="#f7b731"/><rect x="9" y="3" width="1" height="5" fill="#ffd66b"/><rect x="4" y="7" width="8" height="1" fill="#f7b731"/><rect x="2" y="8" width="12" height="1" fill="#140e08"/><rect x="3" y="9" width="10" height="2" fill="#f4f6f8"/><rect x="2" y="9" width="1" height="2" fill="#140e08"/><rect x="13" y="9" width="1" height="2" fill="#140e08"/><rect x="4" y="11" width="8" height="1" fill="#f4f6f8"/><rect x="3" y="11" width="1" height="1" fill="#140e08"/><rect x="12" y="11" width="1" height="1" fill="#140e08"/><rect x="5" y="12" width="6" height="1" fill="#140e08"/></svg>',
      '중식': '<svg viewBox="0 0 16 16" shape-rendering="crispEdges"><rect x="7" y="0" width="1" height="1" fill="#f7b731"/><rect x="6" y="1" width="1" height="2" fill="#e8553d"/><rect x="8" y="1" width="1" height="2" fill="#e8553d"/><rect x="7" y="1" width="1" height="2" fill="#f7b731"/><rect x="4" y="6" width="8" height="1" fill="#140e08"/><rect x="4" y="7" width="8" height="1" fill="#c92f1d"/><rect x="2" y="8" width="12" height="1" fill="#140e08"/><rect x="3" y="9" width="10" height="2" fill="#f4f6f8"/><rect x="2" y="9" width="1" height="2" fill="#140e08"/><rect x="13" y="9" width="1" height="2" fill="#140e08"/><rect x="4" y="11" width="8" height="1" fill="#f4f6f8"/><rect x="3" y="11" width="1" height="1" fill="#140e08"/><rect x="12" y="11" width="1" height="1" fill="#140e08"/><rect x="5" y="12" width="6" height="1" fill="#140e08"/><rect x="3" y="9" width="10" height="1" fill="#e8553d"/></svg>',
      '커틀릿': '<svg viewBox="0 0 16 16" shape-rendering="crispEdges"><rect x="4" y="2" width="8" height="1" fill="#140e08"/><rect x="4" y="3" width="8" height="1" fill="#e0a95a"/><rect x="4" y="4" width="8" height="2" fill="#c98a3d"/><rect x="6" y="3" width="1" height="3" fill="#8a5a34"/><rect x="9" y="3" width="1" height="3" fill="#8a5a34"/><rect x="3" y="3" width="1" height="3" fill="#140e08"/><rect x="12" y="3" width="1" height="3" fill="#140e08"/><rect x="4" y="6" width="8" height="1" fill="#140e08"/><rect x="2" y="8" width="12" height="1" fill="#140e08"/><rect x="3" y="9" width="10" height="2" fill="#f4f6f8"/><rect x="2" y="9" width="1" height="2" fill="#140e08"/><rect x="13" y="9" width="1" height="2" fill="#140e08"/><rect x="4" y="11" width="8" height="1" fill="#f4f6f8"/><rect x="3" y="11" width="1" height="1" fill="#140e08"/><rect x="12" y="11" width="1" height="1" fill="#140e08"/><rect x="5" y="12" width="6" height="1" fill="#140e08"/></svg>',
      '떡볶이': '<svg viewBox="0 0 16 16" shape-rendering="crispEdges"><rect x="5" y="3" width="6" height="1" fill="#140e08"/><rect x="4" y="4" width="1" height="3" fill="#140e08"/><rect x="11" y="4" width="1" height="3" fill="#140e08"/><rect x="5" y="4" width="6" height="3" fill="#e8553d"/><rect x="5" y="4" width="2" height="1" fill="#f7ead2"/><rect x="8" y="5" width="2" height="1" fill="#f7ead2"/><rect x="6" y="6" width="2" height="1" fill="#f7ead2"/><rect x="5" y="7" width="6" height="1" fill="#140e08"/><rect x="2" y="8" width="12" height="1" fill="#140e08"/><rect x="3" y="9" width="10" height="2" fill="#f4f6f8"/><rect x="2" y="9" width="1" height="2" fill="#140e08"/><rect x="13" y="9" width="1" height="2" fill="#140e08"/><rect x="4" y="11" width="8" height="1" fill="#f4f6f8"/><rect x="3" y="11" width="1" height="1" fill="#140e08"/><rect x="12" y="11" width="1" height="1" fill="#140e08"/><rect x="5" y="12" width="6" height="1" fill="#140e08"/></svg>'
    };
    const CAT_ALIAS = { '돈까스': '커틀릿', '함박': '커틀릿', '카레': '커틀릿', '분식': '떡볶이', '아시아': '면', '한식': '국물', '칼국수': '면' };
    const catIcon = cat => CAT_ICONS[cat] || CAT_ICONS[CAT_ALIAS[cat]] || CAT_ICONS['백반'];

    // ── 지도
    const map = new kakao.maps.Map($('map'), { center: new kakao.maps.LatLng(37.5665, 126.9780), level: 8 });
    let radiusCircle = null, myOv = null, pinOv = null;
    const popupOv = new kakao.maps.CustomOverlay({ yAnchor: 1.35, zIndex: 30 });
    kakao.maps.event.addListener(map, 'click', () => popupOv.setMap(null));
    function applySpotToMap(spot) {
      if (radiusCircle) radiusCircle.setMap(null);
      if (myOv) myOv.setMap(null);
      if (!spot) return;
      radiusCircle = new kakao.maps.Circle({
        map, center: new kakao.maps.LatLng(spot.lat, spot.lng), radius: spot.radius_m,
        strokeWeight: 2, strokeColor: '#2b2416', strokeOpacity: .5, strokeStyle: 'shortdash',
        fillColor: '#ece1cb', fillOpacity: .1
      });
      const el = document.createElement('div');
      el.className = 'me-pin'; el.textContent = '나'; el.title = spot.name;
      myOv = new kakao.maps.CustomOverlay({ map, position: new kakao.maps.LatLng(spot.lat, spot.lng), content: el, yAnchor: .5, zIndex: 6 });
      map.setLevel(spot.radius_m > 8000 ? 9 : spot.radius_m > 4000 ? 8 : spot.radius_m > 2500 ? 7 : spot.radius_m > 1000 ? 6 : 5);
      map.setCenter(new kakao.maps.LatLng(spot.lat, spot.lng));
      $('map-note').textContent = `${spot.name} ${spot.radius_label} 맛지도`;
    }
    function showPin(place) {
      if (pinOv) pinOv.setMap(null);
      if (!place) { popupOv.setMap(null); return; }
      const el = document.createElement('div');
      el.className = 'pin'; el.innerHTML = '<span>🍚</span>';
      el.addEventListener('click', () => openPopup(place));
      pinOv = new kakao.maps.CustomOverlay({ map, position: new kakao.maps.LatLng(place.lat, place.lng), content: el, yAnchor: .9, zIndex: 20 });
    }
    function openPopup(p, spot) {
      const el = document.createElement('div');
      el.className = 'kpopup';
      const label = SLOTS[currentSlotKey] ? SLOTS[currentSlotKey].label : '';
      const walk = spot ? walkText(distM(spot.lat, spot.lng, p.lat, p.lng)) : '';
      el.innerHTML = `<div class="popup-kicker">오늘 ${esc(label)} 뭐먹정</div>
        <div class="popup-title">${esc(p.name)}</div>
        <p class="popup-copy">${esc(p.menu)} · ${(p.price || 0).toLocaleString()}원${walk ? '<br>' + esc(walk) : ''}</p>`;
      popupOv.setContent(el);
      popupOv.setPosition(new kakao.maps.LatLng(p.lat, p.lng));
      popupOv.setMap(map);
    }
    function distM(aLat, aLng, bLat, bLng) {
      const R = 6371000, rad = x => x * Math.PI / 180;
      const h = Math.sin(rad(bLat - aLat) / 2) ** 2 + Math.cos(rad(aLat)) * Math.cos(rad(bLat)) * Math.sin(rad(bLng - aLng) / 2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(h));
    }
    const walkText = m => { const min = Math.max(1, Math.round(m / 80)); return min <= 40 ? `도보 약 ${min}분` : `약 ${(m / 1000).toFixed(1)}km`; };

    // ── 카카오 로그인
    async function kakaoLogin() {
      const { error } = await sb.auth.signInWithOAuth({ provider: 'kakao', options: { redirectTo: SITE } });
      if (error) alert('카카오 로그인 시작 실패: ' + error.message);
    }

    // ── 상태
    let me = null;             // { id, nickname }
    let spots = [];            // DB spots (created_at 순)
    let places = [];           // DB places
    let reviews = [];          // DB reviews (전체)
    let nickById = {};         // user_id → nickname
    let todayPicks = [];       // 오늘 내 picks (shown)
    let currentSlotKey = null;
    let countdownTimer = null;
    let cancelledGhosts = [];  // 이번 세션에 별점 취소한 곳 (화면 유지용)
    // 슬롯 열람 상태
    let slotView = 0;          // 공개된 곳 중 지금 보는 인덱스
    let revealedPlaces = [];   // 오늘 공개된 곳 (순서대로)
    let candQueue = [];        // 아직 공개 안 된 후보 (순서대로)

    const myReview = pid => reviews.find(r => r.place_id === pid && r.user_id === me?.id);
    const placeReviews = pid => reviews.filter(r => r.place_id === pid).sort((a, b) => b.updated_at.localeCompare(a.updated_at));
    const avgOf = pid => { const rs = placeReviews(pid); return rs.length ? rs.reduce((s, r) => s + Number(r.rate), 0) / rs.length : 0; };

    // ── 활성 장소 (2슬롯: 평일/주말·공휴일)
    function activeSpot() {
      if (!spots.length) return null;
      if (spots.length === 1) return spots[0];
      const wk = isWeekendLike();
      return spots.find(s => s.days === (wk ? 'weekend' : 'weekday'))
          || spots.find(s => s.days === 'always')
          || spots[0];
    }
    // 오늘의 슬롯 계획: 공개된 마지막 끼니 + 다음 예정
    function slotPlan(spot) {
      const mts = (spot.meal_times || []).slice().sort((a, b) => a.time.localeCompare(b.time));
      if (!mts.length) return { current: null, next: null };
      const now = new Date();
      const nowMin = now.getHours() * 60 + now.getMinutes();
      const toMin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
      const revealed = mts.filter(m => toMin(m.time) <= nowMin);
      const current = revealed.length ? revealed[revealed.length - 1] : null;
      const next = mts.find(m => toMin(m.time) > nowMin) || null;
      return { current, next, first: mts[0] };
    }

    // ── 추천 후보: 반경 + 슬롯, 안 가본 곳 우선 + 평점·거리, 날짜 시드 회전
    function rankedCandidates(spot, slotKey) {
      const cands = places.filter(p =>
        distM(spot.lat, spot.lng, p.lat, p.lng) <= spot.radius_m &&
        (p.slots || []).includes(slotKey));
      if (!cands.length) return [];
      const score = p => (myReview(p.id) ? 0 : 1000) + avgOf(p.id) * 10 - distM(spot.lat, spot.lng, p.lat, p.lng) / 10000;
      const ranked = cands.slice().sort((a, b) => score(b) - score(a));
      const seedStr = todayStr() + slotKey + me.id;
      const seed = [...seedStr].reduce((s, c) => s + c.charCodeAt(0), 0);
      const off = seed % ranked.length;
      return ranked.slice(off).concat(ranked.slice(0, off));
    }

    // ── 홈 렌더
    async function renderHome() {
      setMode('home');
      const spot = activeSpot();
      if (!spot) { openWizard({ mode: me.nickname ? 'setup' : 'first' }); return; }
      applySpotToMap(spot);
      const plan = slotPlan(spot);
      clearInterval(countdownTimer);

      // 예고 라인
      const tease = $('next-tease');
      if (plan.current && plan.next) {
        tease.classList.remove('hidden');
        tease.innerHTML = `<span class="emo">${SLOTS[plan.next.slot].emoji}</span> 다음 · ${SLOTS[plan.next.slot].label}은 ${plan.next.time}에 정해드릴게요`;
      } else tease.classList.add('hidden');

      if (!plan.current) {
        // 공개 전 — 잠김 카드 + 카운트다운
        ['hero-wrap', 'detail', 'no-pick'].forEach(id => $(id).classList.add('hidden'));
        showPin(null);
        const mt = plan.first;
        if (mt) {
          $('locked').classList.remove('hidden');
          $('locked-title').innerHTML = `${esc(mt.time)}에<br>${SLOTS[mt.slot].label}을 정해드릴게요`;
          const tick = () => {
            const [h, m] = mt.time.split(':').map(Number);
            const target = new Date(); target.setHours(h, m, 0, 0);
            const diff = Math.max(0, target - new Date());
            if (diff <= 0) { clearInterval(countdownTimer); renderHome(); return; }
            const hh = Math.floor(diff / 3600000), mm = Math.ceil((diff % 3600000) / 60000);
            $('locked-count').textContent = '공개까지 ' + (hh ? `${hh}시간 ${mm}분` : mm > 1 ? `${mm}분` : '곧 공개돼요');
          };
          tick();
          countdownTimer = setInterval(tick, 20000);
        } else {
          $('locked').classList.remove('hidden');
          $('locked-title').innerHTML = '추천받을 시각을<br>정해주세요';
          $('locked-count').textContent = '왼쪽 아래 📍 에서 설정할 수 있어요';
        }
        renderVisited();
        return;
      }

      // 공개 후
      $('locked').classList.add('hidden');
      currentSlotKey = plan.current.slot;
      const ranked = rankedCandidates(spot, currentSlotKey);
      const shownRows = todayPicks.filter(k => k.slot === currentSlotKey);
      revealedPlaces = shownRows.map(k => places.find(p => p.id === k.place_id)).filter(Boolean);
      if (!revealedPlaces.length) {
        if (!ranked.length) {
          // 후보 없음 — 발굴 요청
          ['hero-wrap', 'detail'].forEach(id => $(id).classList.add('hidden'));
          showPin(null);
          const np = $('no-pick');
          np.classList.remove('hidden');
          np.innerHTML = `
            <div class="hero-kicker"><span class="badge"><span class="emo">🍚</span> 오늘 ${SLOTS[currentSlotKey].label} 뭐먹정</span><small class="muted">${esc(spot.name)} · ${esc(spot.radius_label)}</small></div>
            <div class="hero-title"><h2 class="px" style="font-size:24px">이 동네는 아직이에요</h2></div>
            <p class="menu-line">반경 안에 이 시간대 식당이 없어요</p>
            <button type="button" id="explore-req">🔎 이 동네 발굴 요청하기</button>`;
          $('explore-req').addEventListener('click', async ev => {
            ev.target.disabled = true;
            ev.target.textContent = '접수 중…';
            await sb.from('explore_requests').insert({ user_id: me.id, lat: spot.lat, lng: spot.lng, radius_m: spot.radius_m, slot: currentSlotKey, note: spot.name });
            ev.target.textContent = '접수됐어요 — 준비되면 채워둘게요';
          });
          renderVisited();
          return;
        }
        // 첫 공개 — picks 고정
        const first = ranked[0];
        revealedPlaces = [first];
        todayPicks.push({ slot: currentSlotKey, place_id: first.id });
        sb.from('picks').insert({ user_id: me.id, slot: currentSlotKey, place_id: first.id, status: 'shown', pick_date: todayStr() }).then(() => {});
      }
      $('no-pick').classList.add('hidden');
      const shownIds = revealedPlaces.map(p => p.id);
      candQueue = ranked.filter(p => !shownIds.includes(p.id));
      slotView = Math.min(slotView, revealedPlaces.length - 1);
      if (slotView < 0) slotView = 0;
      $('hero-wrap').classList.remove('hidden');
      renderHero(spot);
      renderVisited();
    }

    function currentPlace() { return revealedPlaces[slotView]; }

    function renderHero(spot) {
      spot = spot || activeSpot();
      const p = currentPlace();
      if (!p) return;
      const label = SLOTS[currentSlotKey].label;
      $('hero-badge').innerHTML = `<span class="emo">🍚</span> 오늘 ${label} 뭐먹정`;
      $('hero-where').textContent = `${spot.name} · ${spot.radius_label}`;
      $('hero-name').textContent = p.name;
      $('hero-ic').innerHTML = catIcon(p.category);
      $('hero-menu').textContent = `${p.menu} · ${(p.price || 0).toLocaleString()}원`;
      const avg = avgOf(p.id);
      $('hero-facts').innerHTML = `
        <div class="fact"><strong>${walkText(distM(spot.lat, spot.lng, p.lat, p.lng))}</strong><span>${esc(spot.name)}에서</span></div>
        <div class="fact"><strong>${esc(p.category)}</strong><span>분류</span></div>
        <div class="fact"><strong>${avg ? '★' + avg.toFixed(1) : '첫 개척'}</strong><span>${avg ? '리뷰 ' + placeReviews(p.id).length + '개' : '아직 리뷰 없음'}</span></div>`;
      // 스와이프 힌트
      const canReveal = revealedPlaces.length < 3 && candQueue.length > 0;
      const left = canReveal ? 3 - revealedPlaces.length : 0;
      const hint = $('swipe-hint');
      if (left > 0) hint.innerHTML = `<span class="arr">✋</span> 옆으로 밀어서 다른 곳 보기 · ${left}번 남음`;
      else if (revealedPlaces.length > 1) hint.innerHTML = `<span class="arr">✋</span> 옆으로 밀어서 ${revealedPlaces.length}곳 비교하기`;
      else hint.innerHTML = '';
      renderDetail(p, spot);
      showPin(p);
      openPopup(p, spot);
      map.setCenter(new kakao.maps.LatLng(p.lat, p.lng));
    }

    // ── 상세 + 리뷰
    function renderDetail(p, spot) {
      const panel = $('detail');
      panel.classList.remove('hidden');
      const menus = Array.isArray(p.menus) ? p.menus : [];
      const rows = placeReviews(p.id);
      panel.innerHTML = `
        <div class="kicker">${esc(p.category)}${p.description ? ' · ' + esc(p.description) : ''}</div>
        <h3>${esc(p.name)}</h3>
        <p class="dmenu">${esc(p.menu)} · ${(p.price || 0).toLocaleString()}원</p>
        ${menus.length ? `<div class="menus">${menus.map(m => `<div class="mi"><b>${esc(m.name)}</b><span>${(m.price || 0).toLocaleString()}원</span></div>`).join('')}</div>` : ''}
        <p class="note">🕐 ${esc(p.hours)}${p.note ? '<br>' + esc(p.note) : ''}</p>
        <div class="links">
          ${p.tel ? `<a class="tel" href="tel:${p.tel.replace(/-/g, '')}">📞 ${esc(p.tel)}</a>` : ''}
          <a class="kakao" href="https://map.kakao.com/link/map/${encodeURIComponent(p.name)},${p.lat},${p.lng}" target="_blank" rel="noopener">🗺 카카오지도</a>
          <a class="naver" href="https://map.naver.com/p/search/${encodeURIComponent(p.name)}" target="_blank" rel="noopener">네이버지도</a>
        </div>
        ${rows.length ? `<div class="visits">
          <div class="avg">★ ${avgOf(p.id).toFixed(1)}<small>리뷰 ${rows.length}개</small></div>
          ${rows.map(r => {
            const mine = r.user_id === me.id;
            const who = nickById[r.user_id] || '익명';
            return `<div class="visit"><span class="who-chip${mine ? ' me' : ''}">${esc(who)}</span><b>${starText(r.rate)}</b>${r.comment ? ' · ' + esc(r.comment) : ''}<small>${r.visited_on}</small></div>`;
          }).join('')}</div>` : ''}
        <button type="button" class="visit-btn" id="visit-btn">🍚 다녀왔어요 — 리뷰 남기기</button>
        <div class="vform" id="visit-form">
          <div class="star-row">
            ${[1, 2, 3, 4, 5].map(v => `<button type="button" class="star" data-v="${v}">★</button>`).join('')}
            <span class="star-label">별점을 골라주세요</span>
          </div>
          <textarea id="visit-comment" placeholder="짧은 감상평 (선택)" maxlength="50"></textarea>
          <div class="char-count" id="char-count">0 / 50</div>
          <button type="button" class="vsave" id="visit-save">기록하기</button>
        </div>`;
      wireReviewForm(p);
    }
    const STAR_WORDS = { 1: '별로였어요', 2: '아쉬워요', 3: '보통', 4: '좋았어요', 5: '또 가고 싶다!' };
    function starText(r) {
      const full = Math.floor(r), half = r % 1 >= 0.5;
      return '★'.repeat(full) + (half ? '½' : '') + '☆'.repeat(5 - full - (half ? 1 : 0));
    }
    // 0.5 단위 별점 (같은 점수 재탭 = 취소)
    function wireStars(root, onPick, init = 0) {
      const stars = [...root.querySelectorAll('.star')];
      const label = root.querySelector('.star-label');
      let rate = init;
      function paint() {
        stars.forEach(el => {
          const v = +el.dataset.v;
          el.classList.toggle('on', rate >= v);
          el.classList.toggle('half', rate >= v - .5 && rate < v);
        });
        if (label) label.textContent = rate ? `${rate}점 · ${STAR_WORDS[Math.max(1, Math.round(rate))]}` : '별점을 골라주세요';
      }
      stars.forEach(b => b.onclick = e => {
        e.stopPropagation();
        const rect = b.getBoundingClientRect();
        let picked = +b.dataset.v - ((e.clientX - rect.left) < rect.width / 2 ? .5 : 0);
        if (Math.abs(rate - picked) < 0.001) picked = 0;
        rate = picked;
        paint();
        onPick(rate);
      });
      paint();
      return { set: v => { rate = v; paint(); } };
    }
    function wireReviewForm(p) {
      const form = $('visit-form');
      $('visit-btn').addEventListener('click', () => form.classList.toggle('on'));
      const ta = $('visit-comment');
      ta.addEventListener('input', () => { $('char-count').textContent = `${ta.value.length} / 50`; });
      let rate = 0;
      const mine = myReview(p.id);
      if (mine) { rate = Number(mine.rate); ta.value = mine.comment || ''; $('char-count').textContent = `${ta.value.length} / 50`; }
      wireStars(form.querySelector('.star-row'), r => { rate = r; }, rate);
      $('visit-save').addEventListener('click', async () => {
        if (!rate) { alert('별점을 골라주세요!'); return; }
        const btn = $('visit-save');
        btn.disabled = true; btn.innerHTML = '<span class="spin"></span>';
        const rec = { place_id: p.id, user_id: me.id, rate, comment: ta.value.trim().slice(0, 50), visited_on: todayStr(), updated_at: new Date().toISOString() };
        const { error } = await sb.from('reviews').upsert(rec, { onConflict: 'place_id,user_id' });
        if (error) { alert('저장 실패: ' + error.message); btn.disabled = false; btn.textContent = '기록하기'; return; }
        cancelledGhosts = cancelledGhosts.filter(g => g.place_id !== p.id);
        await loadReviews();
        renderDetail(p, activeSpot());
        renderVisited();
      });
    }

    // ── 다녀온 곳 (별 재탭 = 즉시 반영, 취소는 흐림 유지 → 다음 진입 때 제외)
    function renderVisited() {
      $('visited-title').classList.remove('hidden');
      $('visited-list').classList.remove('hidden');
      const wrap = $('visited-list');
      const mine = reviews.filter(r => r.user_id === me.id).sort((a, b) => b.updated_at.localeCompare(a.updated_at));
      const items = mine.map(r => ({ place_id: r.place_id, rate: Number(r.rate), comment: r.comment || '', date: r.visited_on }))
        .concat(cancelledGhosts.filter(g => !mine.some(r => r.place_id === g.place_id)));
      $('visited-count').textContent = items.filter(i => i.rate > 0).length;
      if (!items.length) {
        wrap.innerHTML = '<div class="empty-note">아직 기록이 없어요. 추천받은 곳에 다녀오면 별점을 남겨보세요.</div>';
        return;
      }
      wrap.innerHTML = items.map((v, i) => {
        const p = places.find(x => x.id === v.place_id);
        return `<div class="vcard ${v.rate === 0 ? 'off' : ''}" data-i="${i}">
          <div class="vstars">${[1, 2, 3, 4, 5].map(n => `<button type="button" class="star" data-v="${n}">★</button>`).join('')}</div>
          <span class="nm">${esc(p ? p.name : v.place_id)}</span>
          <span class="meta">${v.rate === 0 ? '별점 취소됨 · 다음에 들어오면 목록에서 빠져요' : esc((v.comment ? v.comment + ' · ' : '') + v.date)}</span>
        </div>`;
      }).join('');
      wrap.querySelectorAll('.vcard').forEach(card => {
        const i = +card.dataset.i;
        const v = items[i];
        card.addEventListener('click', e => {
          if (e.target.closest('.star') || e.target.closest('.vconfirm')) return;
          const p = places.find(x => x.id === v.place_id);
          if (p) { renderDetail(p, activeSpot()); showPin(p); openPopup(p, activeSpot()); $('detail').scrollIntoView({ behavior: 'smooth' }); }
        });
        wireStars(card, async r => {
          if (r === 0) {
            if (v.comment) {
              const cf = document.createElement('div');
              cf.className = 'vconfirm';
              cf.innerHTML = `한줄평도 같이 지워져요 <button type="button" class="cy">지울래요</button><button type="button" class="cn">남길래요</button>`;
              card.appendChild(cf);
              cf.querySelector('.cy').onclick = async e => {
                e.stopPropagation();
                await sb.from('reviews').delete().eq('place_id', v.place_id).eq('user_id', me.id);
                cancelledGhosts.push({ place_id: v.place_id, rate: 0, comment: '', date: v.date });
                await loadReviews();
                renderVisited();
              };
              cf.querySelector('.cn').onclick = e => { e.stopPropagation(); renderVisited(); };
              return;
            }
            await sb.from('reviews').delete().eq('place_id', v.place_id).eq('user_id', me.id);
            cancelledGhosts.push({ place_id: v.place_id, rate: 0, comment: '', date: v.date });
            await loadReviews();
            renderVisited();
            return;
          }
          await sb.from('reviews').upsert(
            { place_id: v.place_id, user_id: me.id, rate: r, comment: v.comment, visited_on: todayStr(), updated_at: new Date().toISOString() },
            { onConflict: 'place_id,user_id' });
          cancelledGhosts = cancelledGhosts.filter(g => g.place_id !== v.place_id);
          await loadReviews();
          renderVisited();
        }, v.rate);
      });
    }

    // ── 히어로 스와이프 (← 다음/공개, → 이전, 끝은 점빵이 등장)
    const heroEl = $('hero');
    const noMore = $('no-more');
    const peekEl = $('peek');
    noMore.innerHTML = document.querySelector('.topbar .jb-char').outerHTML;
    function hasNextView() { return slotView < revealedPlaces.length - 1 || (revealedPlaces.length < 3 && candQueue.length > 0); }
    function goNextView() {
      if (slotView < revealedPlaces.length - 1) { slotView++; return true; }
      if (revealedPlaces.length < 3 && candQueue.length) {
        const nxt = candQueue.shift();
        revealedPlaces.push(nxt);
        slotView = revealedPlaces.length - 1;
        todayPicks.push({ slot: currentSlotKey, place_id: nxt.id });
        sb.from('picks').insert({ user_id: me.id, slot: currentSlotKey, place_id: nxt.id, status: 'shown', pick_date: todayStr() }).then(() => {});
        return true;
      }
      return false;
    }
    function goPrevView() { if (slotView > 0) { slotView--; return true; } return false; }
    function setPeek(fwd) {
      let p = null;
      if (fwd) { if (slotView < revealedPlaces.length - 1) p = revealedPlaces[slotView + 1]; }
      else p = revealedPlaces[slotView - 1];
      const key = fwd + ':' + (p ? p.id : '?');
      if (peekEl.dataset.key === key) return;
      peekEl.dataset.key = key;
      peekEl.innerHTML = p
        ? `<h3 class="px">${esc(p.name)}</h3><span class="cat-ic">${catIcon(p.category)}</span>`
        : '<div class="peek-q px">?</div>';
    }
    function slideTo(dir, fromDrag) {
      const ok = dir > 0 ? goNextView() : goPrevView();
      heroEl.classList.remove('dragging');
      heroEl.classList.add('animating');
      if (!ok) { heroEl.style.transform = 'translateX(0)'; setTimeout(() => heroEl.classList.remove('animating'), 240); return; }
      const exitX = dir > 0 ? -110 : 110;
      heroEl.style.transform = `translateX(${exitX}%)`;
      heroEl.style.opacity = '0';
      if (fromDrag) {
        peekEl.classList.add('animating');
        peekEl.style.opacity = '1';
        peekEl.style.transform = 'translateX(0)';
      }
      setTimeout(() => {
        renderHero();
        heroEl.classList.remove('animating');
        if (fromDrag) {
          heroEl.style.transform = 'translateX(0)';
          heroEl.style.opacity = '1';
          requestAnimationFrame(() => {
            peekEl.classList.remove('animating');
            peekEl.style.opacity = 0;
            peekEl.style.transform = 'translateX(120%)';
            peekEl.dataset.key = '';
          });
          return;
        }
        heroEl.style.transform = `translateX(${-exitX * 0.55}%)`;
        heroEl.style.opacity = '0';
        requestAnimationFrame(() => requestAnimationFrame(() => {
          heroEl.classList.add('animating');
          heroEl.style.transform = 'translateX(0)';
          heroEl.style.opacity = '1';
          setTimeout(() => heroEl.classList.remove('animating'), 240);
        }));
      }, 200);
    }
    let sx = 0, sy = 0, dx = 0, dragging = false, horiz = null;
    heroEl.addEventListener('pointerdown', e => {
      if (e.target.closest('button')) return;
      dragging = true; horiz = null; sx = e.clientX; sy = e.clientY; dx = 0;
      heroEl.setPointerCapture(e.pointerId);
      heroEl.classList.add('dragging');
    });
    heroEl.addEventListener('pointermove', e => {
      if (!dragging) return;
      dx = e.clientX - sx;
      const dy = e.clientY - sy;
      if (horiz === null && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) horiz = Math.abs(dx) > Math.abs(dy);
      if (horiz) {
        const w = heroEl.offsetWidth, cap = w / 3, fwd = dx < 0;
        const canGo = fwd ? hasNextView() : slotView > 0;
        if (!canGo) {
          const px = fwd ? Math.max(dx, -cap) : Math.min(dx, cap);
          heroEl.style.transform = `translateX(${px}px)`;
          noMore.classList.toggle('left', !fwd);
          noMore.style.opacity = Math.min(1, Math.abs(px) / (cap * 0.8));
          peekEl.style.opacity = 0;
        } else {
          heroEl.style.transform = `translateX(${dx}px)`;
          noMore.style.opacity = 0;
          setPeek(fwd);
          peekEl.style.opacity = 1;
          peekEl.style.transform = `translateX(${(fwd ? w + 14 : -(w + 14)) + dx * 0.55}px)`;
        }
      }
    });
    function endDrag() {
      if (!dragging) return;
      dragging = false;
      heroEl.classList.remove('dragging');
      const fwd = dx < 0;
      const canGo = fwd ? hasNextView() : slotView > 0;
      if (horiz && Math.abs(dx) > 70 && canGo) slideTo(fwd ? 1 : -1, true);
      else {
        peekEl.style.opacity = 0;
        peekEl.style.transform = 'translateX(120%)';
        heroEl.classList.add('animating');
        heroEl.style.transform = 'translateX(0)';
        setTimeout(() => heroEl.classList.remove('animating'), 240);
        if (horiz && !canGo && Math.abs(dx) > 8) setTimeout(() => { noMore.style.opacity = 0; }, 650);
        else noMore.style.opacity = 0;
      }
    }
    heroEl.addEventListener('pointerup', endDrag);
    heroEl.addEventListener('pointercancel', endDrag);
    $('go-map').addEventListener('click', () => {
      const p = currentPlace();
      if (!p) return;
      map.panTo(new kakao.maps.LatLng(p.lat, p.lng));
      if (map.getLevel() > 4) map.setLevel(4);
      openPopup(p, activeSpot());
      $('map-wrap').scrollIntoView({ behavior: 'smooth' });
    });

    // ── 온보딩 위저드 — (닉네임) → 지도 핀 → 동네 이름 → 반경 → 시각
    const RAD_SETS = {
      seoul: [
        { short: '5분',  label: '도보 5분',  cap: '도보 5분 · 약 400m',   m: 400 },
        { short: '10분', label: '도보 10분', cap: '도보 10분 · 약 800m',  m: 800 },
        { short: '15분', label: '도보 15분', cap: '도보 15분 · 약 1.2km', m: 1200 },
        { short: '3km',  label: '3km',      cap: '차로 3km',             m: 3000 },
        { short: '5km',  label: '5km',      cap: '차로 5km',             m: 5000 }
      ],
      outer: [
        { short: '10분', label: '도보 10분', cap: '도보 10분 · 약 800m',  m: 800 },
        { short: '15분', label: '도보 15분', cap: '도보 15분 · 약 1.2km', m: 1200 },
        { short: '5km',  label: '5km',      cap: '차로 5km',             m: 5000 },
        { short: '10km', label: '10km',     cap: '차로 10km',            m: 10000 },
        { short: '15km', label: '15km',     cap: '차로 15km',            m: 15000 }
      ]
    };
    const RAD_DEFAULT = { seoul: 800, outer: 5000 };
    const BACK_SVG = `<svg viewBox="0 0 13 13" fill="currentColor" aria-hidden="true">
        <rect x="1" y="6" width="1" height="1"/><rect x="2" y="5" width="1" height="1"/><rect x="2" y="7" width="1" height="1"/>
        <rect x="3" y="4" width="1" height="1"/><rect x="3" y="8" width="1" height="1"/><rect x="4" y="3" width="1" height="1"/>
        <rect x="4" y="9" width="1" height="1"/><rect x="2" y="6" width="10" height="1"/></svg>`;

    let draft = null, editIdx = 0, wizSteps = [], wizIdx = 0, wizMode = 'first';
    let setupCircle = null, geocoder = null, pinMoveTimer = null, mapBusy = false, geoTried = false;
    const stepName = () => wizSteps[wizIdx];
    function relayoutKeep() {
      const keep = map.getCenter();
      mapBusy = true;
      map.relayout();
      map.setCenter(keep);
      setTimeout(() => { map.setCenter(keep); mapBusy = false; }, 220);
    }
    function regionOf(s) {
      if (s.region) return s.region;
      // 지오코딩 실패 시 서울 대략 범위로 추정
      if (s.lat && s.lat > 37.42 && s.lat < 37.72 && s.lng > 126.76 && s.lng < 127.19) return 'seoul';
      return 'outer';
    }
    const nearestRad = (m, region) => RAD_SETS[region].reduce((a, b) => Math.abs(b.m - m) < Math.abs(a.m - m) ? b : a);

    // mode: 'first'(닉네임 포함 첫 온보딩) | 'setup'(프로필 있음·장소 없음) | 'edit'(기존 장소 수정) | 'add'(주말 장소 추가)
    function openWizard(opts) {
      wizMode = opts.mode;
      editIdx = opts.idx || 0;
      const clone = s => ({ ...s, meal_times: (s.meal_times || []).map(m => ({ ...m })) });
      if (wizMode === 'edit') {
        draft = spots.map(clone);
      } else if (wizMode === 'add') {
        draft = spots.map(clone);
        draft.push({ name: '', lat: null, lng: null, radius_m: null, radius_label: '', days: 'weekend', meal_times: (spots[0].meal_times || []).map(m => ({ ...m })) });
        editIdx = draft.length - 1;
      } else {
        draft = [{ name: '', lat: null, lng: null, radius_m: null, radius_label: '', days: 'always', meal_times: [] }];
        editIdx = 0;
      }
      wizSteps = (wizMode === 'first' ? ['nick'] : []).concat(['pin', 'name', 'rad', 'time']);
      wizIdx = 0;
      geoTried = wizMode === 'edit';   // 수정이면 기존 핀 유지
      setMode('wizard');
      if (pinOv) pinOv.setMap(null);
      if (radiusCircle) radiusCircle.setMap(null);
      if (myOv) myOv.setMap(null);
      popupOv.setMap(null);
      $('map-note').classList.add('hidden');
      renderWizard();
    }
    function closeWizard() {
      document.body.classList.remove('setup-mode', 'no-map');
      $('wiz-view').classList.add('hidden');
      $('wiz-prog').classList.add('hidden');
      $('center-pin').classList.add('hidden');
      $('map-cap').classList.add('hidden');
      $('map-note').classList.remove('hidden');
      if (setupCircle) { setupCircle.setMap(null); setupCircle = null; }
      relayoutKeep();
    }

    function renderWizard() {
      const s = draft[editIdx];
      const st = stepName();
      const needMap = st === 'pin' || st === 'rad';
      document.body.classList.toggle('no-map', !needMap);
      $('wiz-bar').style.width = ((wizIdx + 1) / wizSteps.length * 100) + '%';
      $('center-pin').classList.toggle('hidden', st !== 'pin');
      $('map-cap').classList.toggle('hidden', !needMap);

      const backHidden = wizIdx === 0 && (wizMode === 'first' || wizMode === 'setup');
      const head = `<button type="button" class="wiz-back ${backHidden ? 'hide' : ''}" id="wiz-back" aria-label="뒤로">${BACK_SVG}</button>`;
      let html = '';

      if (st === 'nick') {
        html = `${head}
          <h2 class="px"><span class="b">닉네임을</span>정해주세요</h2>
          <p class="wiz-sub">리뷰에 표시될 이름이에요.</p>
          <div class="wiz-body">
            <input class="uline" id="wiz-nick" placeholder="닉네임" maxlength="12" value="${esc(me.nickname || me.kakaoNick || '')}">
            <p class="dup-msg" id="dup-msg">이미 쓰고 있는 닉네임이에요</p>
            <p class="wiz-hint">카카오 닉네임을 그대로 써도 좋아요.<br>나중에 언제든 바꿀 수 있어요.</p>
          </div>`;
      } else if (st === 'pin') {
        html = `${head}
          <h2 class="px"><span class="b">자주 밥 먹는 곳,</span>어디쯤인가요?</h2>
          <p class="wiz-sub">지도를 움직여 핀을 맞춰주세요.</p>`;
      } else if (st === 'name') {
        html = `${head}
          <h2 class="px"><span class="b">동네의</span>이름은 무엇인가요?</h2>
          <div class="wiz-body">
            <input class="uline" id="wiz-name" placeholder="${wizMode === 'add' ? '집' : '회사'}" maxlength="10" value="${esc(s.name)}">
            <div class="picks" id="wiz-picks">
              ${['회사', '집', '본가', '학교'].map(n => `<button type="button" class="pick ${s.name === n ? 'on' : ''}">${n}</button>`).join('')}
            </div>
            <p class="wiz-hint">${wizMode === 'add' ? '주말·공휴일에는 이 동네에서 추천해드려요.' : '나중에 장소를 하나 더 추가하면<br>평일은 회사, 주말은 집처럼 자동으로 바뀌어요.'}</p>
          </div>`;
      } else if (st === 'rad') {
        const region = regionOf(s);
        if (!s.radius_m) { const d = nearestRad(RAD_DEFAULT[region], region); s.radius_m = d.m; s.radius_label = d.label; }
        const cur = nearestRad(s.radius_m, region);
        html = `${head}
          <h2 class="px"><span class="b">여기서부터</span>얼마나 멀리까지?</h2>
          <p class="wiz-sub">이 안에서만 골라드릴게요.</p>
          <div class="wiz-body" style="margin-top:24px">
            <div class="seg" id="wiz-rads" style="margin-top:0">
              ${RAD_SETS[region].map(o => `<button type="button" class="${o.m === cur.m ? 'on' : ''}" data-m="${o.m}">${o.short}</button>`).join('')}
            </div>
          </div>`;
      } else {
        const mts = (s.meal_times || []).slice().sort((a, b) => a.time.localeCompare(b.time));
        html = `${head}
          <h2 class="px"><span class="b">언제</span>알려드릴까요?</h2>
          <p class="wiz-sub">시각을 정하면 끼니는 알아서 구분해요.</p>
          <div class="wiz-body">
            <div class="flabel" style="margin-top:0">추천받을 시각</div>
            <div class="time-row"><input type="time" id="wiz-time" value="12:00"><button type="button" class="time-add" id="wiz-add">추가</button></div>
            <div class="mts" id="wiz-mts">
              ${mts.map((m, i) => `<span class="mt"><span class="emo">${SLOTS[m.slot].emoji}</span> <b>${m.time}</b> ${SLOTS[m.slot].label}
                <button type="button" data-i="${i}">✕</button></span>`).join('')}
            </div>
            <p class="wiz-hint">끼니당 하나씩, 최대 4번까지.<br>아침 · 점심 · 저녁 · 야식은 시각으로 자동 분류돼요.</p>
          </div>`;
      }
      $('wiz-view').innerHTML = html;
      $('wiz-extra').innerHTML = '';

      const cta = $('wiz-cta');
      cta.textContent = st === 'nick' ? '이 이름으로 할게요'
        : st === 'pin' ? '여기로 할게요'
        : wizIdx === wizSteps.length - 1 ? (wizMode === 'edit' || wizMode === 'add' ? '저장' : '이대로 시작하기') : '다음';
      cta.disabled = false;
      cta.onclick = () => wizNext();
      $('wiz-back').onclick = () => wizBack();

      wireWizardStep();
      relayoutKeep();
      if (needMap) setTimeout(setupMapForStep, 240);
    }

    function wireWizardStep() {
      const s = draft[editIdx];
      const st = stepName();
      if (st === 'nick') {
        const el = $('wiz-nick');
        setTimeout(() => el.focus(), 80);
        el.addEventListener('input', () => { el.classList.remove('dup'); $('dup-msg').classList.remove('on'); });
      } else if (st === 'name') {
        const nameEl = $('wiz-name');
        setTimeout(() => nameEl.focus(), 80);
        nameEl.addEventListener('input', e => {
          s.name = e.target.value;
          $('wiz-picks').querySelectorAll('.pick').forEach(b => b.classList.toggle('on', b.textContent === s.name));
        });
        $('wiz-picks').querySelectorAll('.pick').forEach(b => b.addEventListener('click', () => {
          s.name = b.textContent;
          nameEl.value = s.name;
          $('wiz-picks').querySelectorAll('.pick').forEach(x => x.classList.toggle('on', x === b));
        }));
      } else if (st === 'rad') {
        const region = regionOf(s);
        $('wiz-rads').querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
          const opt = RAD_SETS[region].find(o => o.m === +b.dataset.m);
          s.radius_m = opt.m;
          s.radius_label = opt.label;
          $('wiz-rads').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
          drawSetupCircle();
        }));
      } else if (st === 'time') {
        $('wiz-add').addEventListener('click', () => {
          const t = $('wiz-time').value;
          if (!t) return;
          const slot = slotOf(t);
          if (s.meal_times.some(m => m.slot === slot)) {
            alert(`${SLOTS[slot].label} 시간은 이미 있어요 — 끼니별로 하나씩만 정할 수 있어요.`);
            return;
          }
          s.meal_times.push({ time: t, slot });
          s.meal_times.sort((a, b) => a.time.localeCompare(b.time));
          renderWizard();
        });
        $('wiz-mts').querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
          const sorted = s.meal_times.slice().sort((a, b) => a.time.localeCompare(b.time));
          const target = sorted[+b.dataset.i];
          s.meal_times = s.meal_times.filter(m => m !== target);
          renderWizard();
        }));
      }
    }

    // 지도 — pin 스텝: 중앙 고정 핀, rad 스텝: 반경 원
    function setupMapForStep() {
      const s = draft[editIdx];
      const st = stepName();
      const center = s.lat ? new kakao.maps.LatLng(s.lat, s.lng) : map.getCenter();
      if (s.lat) map.setCenter(center);
      if (st === 'pin') {
        if (setupCircle) { setupCircle.setMap(null); setupCircle = null; }
        if (map.getLevel() > 5) map.setLevel(4);
        if (!s.lat && !geoTried && navigator.geolocation) {
          geoTried = true;
          $('map-cap').innerHTML = `<span class="emo">📍</span> 현재 위치를 찾는 중…`;
          navigator.geolocation.getCurrentPosition(pos => {
            if (stepName() !== 'pin' || !draft) return;
            mapBusy = true;
            const here = new kakao.maps.LatLng(pos.coords.latitude, pos.coords.longitude);
            map.setCenter(here);
            map.setLevel(4);
            draft[editIdx].lat = pos.coords.latitude;
            draft[editIdx].lng = pos.coords.longitude;
            setTimeout(() => { mapBusy = false; updatePinCaption(); }, 250);
          }, () => {
            if (!draft[editIdx].lat) { draft[editIdx].lat = center.getLat(); draft[editIdx].lng = center.getLng(); }
            updatePinCaption();
          }, { timeout: 6000, maximumAge: 300000 });
          return;
        }
        if (!s.lat) { s.lat = center.getLat(); s.lng = center.getLng(); }
        updatePinCaption();
      } else {
        drawSetupCircle();
      }
    }
    function drawSetupCircle() {
      const s = draft[editIdx];
      if (setupCircle) setupCircle.setMap(null);
      setupCircle = new kakao.maps.Circle({
        map, center: new kakao.maps.LatLng(s.lat, s.lng), radius: s.radius_m,
        strokeWeight: 2, strokeColor: '#2b2416', strokeOpacity: .5, strokeStyle: 'shortdash',
        fillColor: '#ece1cb', fillOpacity: .22
      });
      const b = setupCircle.getBounds();
      mapBusy = true;
      if (b) map.setBounds(b, 28, 28, 28, 28);
      else map.setCenter(new kakao.maps.LatLng(s.lat, s.lng));
      setTimeout(() => { mapBusy = false; }, 240);
      const opt = nearestRad(s.radius_m, regionOf(s));
      $('map-cap').innerHTML = `<span class="emo">${s.radius_m <= 1600 ? '🚶' : '🚗'}</span> ${opt.cap}`;
    }
    function updatePinCaption() {
      const s = draft[editIdx];
      $('map-cap').innerHTML = `<span class="emo">📍</span> 위치를 확인하는 중…`;
      if (!geocoder && kakao.maps.services) geocoder = new kakao.maps.services.Geocoder();
      if (!geocoder) { $('map-cap').innerHTML = `<span class="emo">📍</span> ${s.lat.toFixed(5)}, ${s.lng.toFixed(5)}`; return; }
      const reqStep = stepName();
      geocoder.coord2Address(s.lng, s.lat, (res, status) => {
        if (reqStep !== stepName() || !document.body.classList.contains('setup-mode')) return;
        if (status === kakao.maps.services.Status.OK && res[0]) {
          const a = res[0].road_address || res[0].address;
          const r1 = (res[0].address && res[0].address.region_1depth_name) || '';
          s.region = r1.startsWith('서울') ? 'seoul' : 'outer';
          $('map-cap').innerHTML = `<span class="emo">📍</span> ${esc(a.address_name)}`;
        } else {
          $('map-cap').innerHTML = `<span class="emo">📍</span> ${s.lat.toFixed(5)}, ${s.lng.toFixed(5)}`;
        }
      });
    }
    kakao.maps.event.addListener(map, 'center_changed', () => {
      if (mapBusy || !document.body.classList.contains('setup-mode') || stepName() !== 'pin' || !draft) return;
      const c = map.getCenter();
      draft[editIdx].lat = c.getLat();
      draft[editIdx].lng = c.getLng();
      clearTimeout(pinMoveTimer);
      pinMoveTimer = setTimeout(updatePinCaption, 450);
    });

    function wizBack() {
      if (wizIdx === 0) {
        if (wizMode === 'edit' || wizMode === 'add') { closeWizard(); renderSettings(); }
        return;
      }
      wizIdx--;
      renderWizard();
    }
    async function wizNext() {
      const s = draft[editIdx];
      const st = stepName();
      if (st === 'nick') {
        const el = $('wiz-nick');
        const n = el.value.trim().slice(0, 12);
        if (!n) { el.focus(); return; }
        const cta = $('wiz-cta');
        cta.disabled = true;
        const ok = await saveNickname(n, msg => { el.classList.add('dup'); $('dup-msg').textContent = msg; $('dup-msg').classList.add('on'); });
        cta.disabled = false;
        if (!ok) return;
        wizIdx++; renderWizard(); return;
      }
      if (st === 'name' && !s.name.trim()) { alert('동네 이름을 정해주세요.'); return; }
      if (wizIdx < wizSteps.length - 1) { wizIdx++; renderWizard(); return; }
      // 마지막 스텝 (시각) → 저장
      if (!s.meal_times.length) { alert('추천받을 시각을 최소 1개 정해주세요.'); return; }
      draft.forEach((d, i) => { if (!d.name.trim()) d.name = '장소' + (i + 1); });
      if (draft.some(d => !d.lat)) { alert('위치가 설정되지 않은 장소가 있어요.'); return; }
      // 2슬롯 자동 배정: 1곳이면 매일, 2곳이면 평일/주말
      if (draft.length === 1) draft[0].days = 'always';
      else { draft[0].days = 'weekday'; draft[1].days = 'weekend'; }
      const cta = $('wiz-cta');
      cta.disabled = true;
      cta.innerHTML = '<span class="spin"></span> 저장 중…';
      await sb.from('spots').delete().eq('user_id', me.id);
      const { error } = await sb.from('spots').insert(draft.map(d => ({
        user_id: me.id, name: d.name.trim(), lat: d.lat, lng: d.lng,
        radius_m: d.radius_m, radius_label: d.radius_label, days: d.days, meal_times: d.meal_times
      })));
      if (error) {
        cta.disabled = false;
        cta.textContent = '저장';
        alert('저장 실패: ' + error.message);
        return;
      }
      closeWizard();
      await Promise.all([loadSpots(), loadPicks()]);
      slotView = 0;
      renderHome();
    }

    // ── 닉네임 저장 (중복 확인 포함)
    async function saveNickname(n, onDup) {
      const { data: taken } = await sb.from('profiles').select('id').eq('nickname', n).neq('id', me.id);
      if (taken && taken.length) { onDup('이미 쓰고 있는 닉네임이에요'); return false; }
      const { error } = await sb.from('profiles').upsert({ id: me.id, nickname: n });
      if (error) {
        if (String(error.message).includes('duplicate') || error.code === '23505') { onDup('이미 쓰고 있는 닉네임이에요'); return false; }
        alert('닉네임 저장 실패: ' + error.message);
        return false;
      }
      me.nickname = n;
      $('who').textContent = n;
      nickById[me.id] = n;
      return true;
    }

    // ── 설정 (내 동네)
    function renderSettings() {
      setMode('settings');
      const view = $('settings-view');
      const spotCard = (s, i) => {
        const mts = (s.meal_times || []).slice().sort((a, b) => a.time.localeCompare(b.time));
        const times = mts.map(m => `<span class="emo">${SLOTS[m.slot].emoji}</span> ${m.time}`).join(' · ');
        return `<button type="button" class="slot-card" data-i="${i}">
          <span class="ic"><span class="emo" style="font-size:26px">${i === 0 ? '🏢' : '🏠'}</span></span>
          <span class="tx"><span class="nm">${esc(s.name)}</span>
            <span class="mt2">${esc(s.radius_label)}${times ? '<br>' + times : ''}</span></span>
          <span class="arr">›</span>
        </button>`;
      };
      let slotsHtml = '';
      if (spots.length >= 1) {
        slotsHtml += `<div class="slot-label">${spots.length === 1 ? '매일 <i>— 주말 장소를 추가하면 평일 전용이 돼요</i>' : '평일'}</div>` + spotCard(spots[0], 0);
      }
      if (spots.length >= 2) {
        slotsHtml += `<div class="slot-label" style="margin-top:10px">주말 · 공휴일</div>` + spotCard(spots[1], 1)
          + `<button type="button" class="slot-del" id="slot-del">주말 장소 삭제</button>`;
      } else {
        slotsHtml += `<div class="slot-label" style="margin-top:10px">주말 · 공휴일</div>
          <button type="button" class="slot-card empty" id="slot-add">
            <span class="ic"><span class="emo" style="font-size:26px">🏠</span></span>
            <span class="tx"><span class="nm">+ 주말엔 다른 동네에서 드세요?</span>
              <span class="mt2">지금은 평일 장소로 주말에도 추천해드려요</span></span>
          </button>`;
      }
      view.innerHTML = `
        <button type="button" class="wiz-back" id="set-back" aria-label="뒤로">${BACK_SVG}</button>
        <h2 class="px"><span class="b">내 동네</span>어디서 드세요?</h2>
        <p class="sub">평일과 주말·공휴일, 두 곳까지 정할 수 있어요.</p>
        <div class="slots">${slotsHtml}</div>
        <div class="etc">
          <button type="button" class="etc-row" id="nick-row">닉네임 <b>${esc(me.nickname || '')}</b></button>
          <div class="nick-edit hidden" id="nick-edit">
            <input id="nick-input" maxlength="12" value="${esc(me.nickname || '')}">
            <button type="button" id="nick-save">저장</button>
          </div>
          <p class="dup-msg" id="set-dup"></p>
          <button type="button" class="etc-row danger" id="settings-logout">로그아웃</button>
        </div>`;
      $('set-back').onclick = () => renderHome();
      view.querySelectorAll('.slot-card[data-i]').forEach(b => b.onclick = () => openWizard({ mode: 'edit', idx: +b.dataset.i }));
      const add = $('slot-add');
      if (add) add.onclick = () => openWizard({ mode: 'add' });
      const del = $('slot-del');
      if (del) del.onclick = async () => {
        if (!confirm('주말 장소를 삭제할까요? 평일 장소가 다시 매일 적용돼요.')) return;
        const keep = { ...spots[0], days: 'always' };
        await sb.from('spots').delete().eq('user_id', me.id);
        await sb.from('spots').insert({ user_id: me.id, name: keep.name, lat: keep.lat, lng: keep.lng, radius_m: keep.radius_m, radius_label: keep.radius_label, days: 'always', meal_times: keep.meal_times });
        await loadSpots();
        renderSettings();
      };
      $('nick-row').onclick = () => {
        $('nick-edit').classList.toggle('hidden');
        if (!$('nick-edit').classList.contains('hidden')) $('nick-input').focus();
      };
      $('nick-save').onclick = async () => {
        const n = $('nick-input').value.trim().slice(0, 12);
        if (!n || n === me.nickname) { $('nick-edit').classList.add('hidden'); return; }
        const ok = await saveNickname(n, msg => { const d = $('set-dup'); d.textContent = msg; d.classList.add('on'); });
        if (ok) renderSettings();
      };
      $('settings-logout').onclick = doLogout;
    }

    // ── 화면 모드 전환
    const HOME_IDS = ['next-tease', 'locked', 'hero-wrap', 'no-pick', 'detail', 'visited-title', 'visited-list'];
    function setMode(mode) {
      document.body.classList.remove('login-mode', 'setup-mode', 'no-map', 'settings-mode');
      $('login-view').classList.add('hidden');
      $('wiz-view').classList.add('hidden');
      $('wiz-prog').classList.add('hidden');
      $('settings-view').classList.add('hidden');
      HOME_IDS.forEach(id => $(id).classList.add('hidden'));
      $('fab').classList.add('hidden');
      if (mode === 'login') {
        document.body.classList.add('login-mode');
        $('login-view').classList.remove('hidden');
      } else if (mode === 'wizard') {
        document.body.classList.add('setup-mode');
        $('wiz-view').classList.remove('hidden');
        $('wiz-prog').classList.remove('hidden');
      } else if (mode === 'settings') {
        document.body.classList.add('settings-mode');
        $('settings-view').classList.remove('hidden');
      } else if (mode === 'home') {
        $('fab').classList.remove('hidden');
        relayoutKeep();
      }
    }

    // ── 데이터 로드
    async function loadSpots() {
      const { data } = await sb.from('spots').select('*').order('created_at');
      spots = (data || []).sort((a, b) => (a.days === 'weekend' ? 1 : 0) - (b.days === 'weekend' ? 1 : 0));
    }
    async function loadPlaces() {
      const { data } = await sb.from('places').select('*');
      places = data || [];
    }
    async function loadReviews() {
      const [r1, r2] = await Promise.all([
        sb.from('reviews').select('*'),
        sb.from('profiles').select('id,nickname')
      ]);
      reviews = r1.data || [];
      nickById = Object.fromEntries((r2.data || []).map(p => [p.id, p.nickname]));
    }
    async function loadPicks() {
      const { data } = await sb.from('picks').select('slot,place_id,created_at').eq('pick_date', todayStr()).eq('status', 'shown').order('created_at');
      todayPicks = data || [];
    }

    // ── 부팅
    async function doLogout() {
      if (!confirm('로그아웃할까요?')) return;
      await sb.auth.signOut();
      me = null;
      setMode('login');
    }
    async function boot() {
      const { data: { session } } = await sb.auth.getSession();
      if (location.search.includes('code=')) history.replaceState(null, '', location.pathname);
      if (!session) { setMode('login'); return; }
      const u = session.user;
      me = {
        id: u.id,
        nickname: null,
        kakaoNick: u.user_metadata?.name || u.user_metadata?.full_name || u.user_metadata?.preferred_username || ''
      };
      const { data: profile } = await sb.from('profiles').select('*').eq('id', u.id).maybeSingle();
      if (profile) me.nickname = profile.nickname;
      $('who').textContent = me.nickname || '';
      $('logout-btn').classList.remove('hidden');
      await Promise.all([loadSpots(), loadPlaces(), loadReviews(), loadPicks()]);
      map.relayout();
      if (!me.nickname) openWizard({ mode: 'first' });
      else if (!spots.length) openWizard({ mode: 'setup' });
      else renderHome();
    }
    $('kakao-login').addEventListener('click', kakaoLogin);
    $('logout-btn').addEventListener('click', doLogout);
    $('fab').addEventListener('click', renderSettings);
    boot();
  </script>
</body>
</html>
