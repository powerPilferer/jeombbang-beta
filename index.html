<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>점빵이 — 끼니마다 딱 한 곳</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2096%2072%22%20width%3D%2232%22%20height%3D%2224%22%20shape-rendering%3D%22crispEdges%22%3E%3Cg%20fill%3D%22%23ece1cb%22%3E%3Crect%20x%3D%2232%22%20y%3D%228%22%20width%3D%2232%22%20height%3D%2216%22%2F%3E%3C%2Fg%3E%3Cg%20fill%3D%22%23f7b731%22%3E%3Crect%20x%3D%228%22%20y%3D%2232%22%20width%3D%2280%22%20height%3D%2224%22%2F%3E%3Crect%20x%3D%2224%22%20y%3D%2256%22%20width%3D%2248%22%20height%3D%228%22%2F%3E%3C%2Fg%3E%3Cg%20fill%3D%22%23ffffff%22%3E%3Crect%20x%3D%2224%22%20y%3D%2240%22%20width%3D%228%22%20height%3D%2216%22%2F%3E%3Crect%20x%3D%2264%22%20y%3D%2240%22%20width%3D%228%22%20height%3D%2216%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E">
  <meta name="theme-color" content="#232322">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/MonadABXY/mona-font/web/mona.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <style>
    :root {
      color-scheme: dark;
      --ink: #ffffff;
      --muted: #8d8d94;
      --paper: #232322;
      --panel: rgba(35, 35, 34, .9);
      --card: #2c2c2b;
      --chip: #38383a;
      --uline: rgba(236, 225, 203, .9);
      --line: rgba(255, 255, 255, .08);
      --sel: #3f3f43;
      --beige: #ece1cb;
      --beige-ink: #2b2416;
      --blue: #0a84ff;
      --star: #ffd60a;
      --kakao: #fee500;
    }
    /* 픽셀 강조체 — 타이틀 전용 */
    .px { font-family: 'Mona12', monospace; -webkit-font-smoothing: none; font-smooth: never; letter-spacing: 0; }
    /* 픽셀 이모지 (Mona12 내장) */
    .emo { font-family: "Mona12 Color Emoji", "Mona12 Emoji", sans-serif; -webkit-font-smoothing: none;
      font-smooth: never; font-size: 12px; line-height: 1; vertical-align: -1px; display: inline-block; }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body { font-family: "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", sans-serif; color: var(--ink); background: var(--paper); }
    button, input { font: inherit; }
    .hidden { display: none !important; }

    /* ── 모바일 우선 레이아웃: 상단 지도 + 아래 콘텐츠 ── */
    .topbar { position: sticky; top: 0; z-index: 900; display: flex; align-items: center; gap: 9px;
      padding: calc(env(safe-area-inset-top) + 12px) 16px 12px; background: var(--panel);
      backdrop-filter: blur(24px) saturate(1.4); -webkit-backdrop-filter: blur(24px) saturate(1.4); }
    .topbar h1 { margin: 0; font-size: 17px; letter-spacing: -.02em; display: flex; align-items: center; gap: 7px; flex: 1; }
    .beta { padding: 2px 7px; border-radius: 999px; background: var(--blue); color: #fff; font-size: 10px; font-weight: 800; letter-spacing: .05em; }
    .who { color: var(--muted); font-size: 12.5px; font-weight: 600; }
    #cfg-btn, #logout-btn { border: 0; background: var(--card); border-radius: 10px; padding: 7px 9px; font-size: 14px; cursor: pointer; color: var(--ink); }
    #map-wrap { position: relative; height: 40vh; min-height: 260px; }
    #map { width: 100%; height: 100%; background: #e9e2d6; }
    .map-note { position: absolute; z-index: 450; left: 12px; top: 12px; padding: 8px 12px; border-radius: 11px;
      background: var(--panel); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      font-size: 12px; font-weight: 700; box-shadow: 0 6px 20px rgba(0,0,0,.3); }
    main { max-width: 560px; margin: 0 auto; padding: 16px 16px calc(env(safe-area-inset-bottom) + 40px); display: grid; gap: 14px; }
    @media (min-width: 900px) {
      body { display: grid; grid-template-columns: 470px minmax(0,1fr); grid-template-rows: auto 1fr; height: 100vh; }
      .topbar { grid-column: 1; }
      #map-wrap { grid-column: 2; grid-row: 1 / 3; height: 100vh; }
      main { grid-column: 1; overflow-y: auto; width: 100%; max-width: none; }
    }

    /* ── 카드 공통 (iOS 면 톤) ── */
    .card { padding: 18px; border-radius: 20px; background: var(--card); }
    .kicker { color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .08em; }
    .muted { color: var(--muted); }

    /* ── 로그인 뷰 (첫화면 A안: 미니멀 센터, 풀스크린) ── */
    body.login-mode .topbar, body.login-mode #map-wrap { display: none; }
    body.login-mode main { display: flex; min-height: 100dvh; padding-top: 0; }
    @media (min-width: 900px) { body.login-mode { display: block; height: auto; } body.login-mode main { max-width: 560px; overflow: visible; } }
    #login-view { flex: 1; display: flex; flex-direction: column; align-items: center; text-align: center;
      padding: calc(env(safe-area-inset-top) + 52px) 12px 6px; }
    .login-brand { font-size: 13px; font-weight: 800; letter-spacing: .02em; color: var(--muted); }
    .jb-char { width: 128px; height: 128px; margin-top: 15vh; image-rendering: pixelated; animation: bob 1.4s steps(1, end) infinite; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } } 50% { transform: translateY(-4px); } }
    .jb-char .lid { opacity: 0; animation: blink 4.6s linear infinite; }
    @keyframes blink { 0%, 91.5%, 96.5%, 100% { opacity: 0; } 92.5%, 95.5% { opacity: 1; } }
    #login-view h2 { margin: 0; font-size: 48px; font-weight: 700; line-height: 1.15; }
    .title-group { margin-top: 24px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .expand { display: inline-block; background: rgba(236, 225, 203, .13); color: var(--beige);
      padding: 9px 16px; border-radius: 999px; font-weight: 700; font-size: 16px; line-height: 1.35; white-space: nowrap; }
    #login-view h2 .beige { color: var(--beige); }
    #login-view p { margin: 30px 0 0; color: var(--muted); font-size: 14px; line-height: 1.65; }
    .login-grow { flex: 1; }
    #kakao-login { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; max-width: 340px;
      padding: 16px; border: 0; border-radius: 999px; background: var(--kakao); color: #191600;
      font-weight: 700; font-size: 15px; letter-spacing: -.02em; cursor: pointer; }
    #kakao-login svg { width: 18px; height: 18px; flex: none; }
    .login-foot { margin-top: 13px; font-size: 11.5px; color: var(--muted); line-height: 1.5; }


    /* ── 온보딩 위저드 (setup-mode: 풀스크린 4스텝) ── */
    body.setup-mode { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
    body.setup-mode .topbar { display: none; }
    body.setup-mode main { order: 1; flex: 0 0 auto; display: block; width: 100%; max-width: 430px;
      margin: 0 auto; overflow: visible;
      padding: calc(env(safe-area-inset-top) + 26px) 26px 0; }
    body.setup-mode #map-wrap { order: 2; flex: 1 1 auto; width: 100%; max-width: 430px; margin: 44px auto 0;
      height: auto; min-height: 0; border-radius: 20px; overflow: hidden; }
    body.setup-mode.no-map #map-wrap { display: none; }
    body.setup-mode.no-map main { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }
    body.setup-mode.no-map #wiz-view { flex: 1; display: flex; flex-direction: column; min-height: 0; }
    #setup-foot { display: none; }
    body.setup-mode #setup-foot { order: 3; display: block; width: 100%; max-width: 430px;
      margin: 0 auto; padding: 0 26px calc(env(safe-area-inset-bottom) + 26px); }
    #wiz-extra:not(:empty) { margin-top: 20px; }
    #wiz-extra .seg { margin-top: 0; }
    body.setup-mode .wiz-cta { margin-top: 26px; }
    @media (min-width: 900px) {
      body.setup-mode { display: flex; height: 100dvh; }
      body.setup-mode #map-wrap { grid-column: auto; grid-row: auto; }
    }
    /* 진행 라인 · 뒤로가기 */
    .wiz-prog { position: fixed; left: 0; right: 0; top: 0; height: 2px; background: rgba(255,255,255,.07); z-index: 950; }
    .wiz-prog i { display: block; height: 100%; background: var(--beige); width: 25%;
      transition: width .35s cubic-bezier(.4, 0, .2, 1); }
    .wiz-back { border: 0; background: none; cursor: pointer; padding: 8px 8px 8px 0; margin: 0 0 22px -2px;
      color: var(--muted); transition: color .15s; }
    .wiz-back:hover { color: var(--beige); }
    .wiz-back svg { display: block; width: 26px; height: 26px; image-rendering: pixelated; shape-rendering: crispEdges; }
    .wiz-back.hide { visibility: hidden; }
    /* 질문 */
    .wiz h2 { margin: 0; font-size: 36px; font-weight: 700; line-height: 1.4; }
    .wiz h2 .b { color: var(--beige); display: block; }
    .wiz-sub { margin: 16px 0 0; color: var(--muted); font-size: 13.5px; line-height: 1.65; letter-spacing: -.01em; }
    .wiz-body { margin-top: 44px; }
    body.setup-mode.no-map .wiz-body { flex: 1; display: flex; flex-direction: column; }
    /* 밑줄 입력 (동네 이름) */
    .uline { width: 100%; border: 0; border-bottom: 1.5px solid var(--uline); background: none; color: var(--ink);
      padding: 6px 2px 12px; font-size: 26px; font-weight: 700; letter-spacing: -.03em; font-family: inherit; }
    .uline:focus { outline: none; border-bottom-color: #fff; }
    .uline::placeholder { color: #5c5c62; font-weight: 600; }
    .picks { display: flex; gap: 20px; margin-top: 22px; }
    .pick { border: 0; background: none; color: var(--muted); font-size: 14px; font-weight: 600; cursor: pointer; padding: 0; }
    .pick.on { color: var(--beige); font-weight: 800; }
    .wiz-hint { margin-top: auto; color: #63636a; font-size: 12px; line-height: 1.6; padding-bottom: 6px; }
    /* 세그먼트 (요일 · 반경 공용) */
    .seg { display: flex; width: 100%; margin-top: 10px; background: var(--card); border-radius: 999px; padding: 4px; gap: 4px; }
    .seg button { flex: 1; min-width: 0; border: 0; border-radius: 999px; padding: 15px 0; background: none;
      color: var(--muted); font-size: 14.5px; font-weight: 700; letter-spacing: -.02em; cursor: pointer;
      transition: .16s; font-family: inherit; }
    .seg button.on { background: var(--beige); color: var(--beige-ink); font-weight: 800; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
    .flabel { margin-top: 30px; color: var(--muted); font-size: 11.5px; font-weight: 800; letter-spacing: .07em; }
    /* 시각 입력 */
    .time-row { display: flex; width: 100%; gap: 10px; align-items: stretch; margin-top: 10px; }
    .time-row input[type=time] { flex: 1; min-width: 0; border: 0; border-radius: 14px; background: var(--card);
      color: var(--ink); padding: 16px 18px; font-size: 22px; font-weight: 700; font-family: inherit; letter-spacing: -.02em; }
    .time-row input[type=time]:focus { outline: 2px solid rgba(236,225,203,.45); }
    .time-row input[type=time]::-webkit-calendar-picker-indicator { filter: invert(1) brightness(2); opacity: .9;
      cursor: pointer; width: 22px; height: 22px; padding: 2px; }
    .time-add { flex: none; border: 0; border-radius: 999px; padding: 0 22px; background: var(--chip); color: var(--ink);
      font-weight: 700; font-size: 15px; letter-spacing: -.02em; cursor: pointer; font-family: inherit; }
    .mts { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 16px; }
    .mt { display: inline-flex; align-items: center; gap: 10px; padding: 11px 15px; border-radius: 999px;
      background: rgba(236,225,203,.22); border: 1px solid rgba(236,225,203,.42); color: var(--beige);
      font-size: 14px; font-weight: 700; letter-spacing: -.01em; }
    .mt b { font-weight: 800; color: #fff; }
    .mt button { border: 0; background: none; color: var(--beige); opacity: .65; cursor: pointer;
      padding: 2px 0 2px 2px; font-size: 13px; }
    /* 지도 위 고정 핀 · 캡션 */
    .center-pin { position: absolute; left: 50%; top: 50%; z-index: 460; width: 32px; height: 32px;
      border-radius: 50% 50% 50% 7px; background: var(--beige-ink); border: 3.5px solid var(--beige);
      transform: translate(-50%, -100%) rotate(-45deg); box-shadow: 0 8px 18px rgba(0,0,0,.32); pointer-events: none; }
    .center-pin span { display: block; transform: rotate(45deg); text-align: center; line-height: 25px; font-size: 13px; }
    .map-cap { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 460; white-space: nowrap;
      background: rgba(26,26,28,.9); border-radius: 999px; padding: 9px 15px; font-size: 12.5px; font-weight: 600;
      pointer-events: none; max-width: calc(100% - 28px); overflow: hidden; text-overflow: ellipsis; }
    /* CTA */
    .wiz-cta { width: 100%; padding: 18px; border: 0; border-radius: 999px; background: var(--beige);
      color: var(--beige-ink); font-weight: 800; font-size: 15.5px; letter-spacing: -.02em; cursor: pointer; font-family: inherit; }
    .wiz-cta:disabled { opacity: .5; cursor: default; }
    /* ── 홈: 추천 카드 ── */
    .hero-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .badge { display: inline-flex; padding: 6px 11px; border-radius: 999px; font-size: 12px; font-weight: 700; background: var(--blue); color: #fff; }
    .hero h2 { margin: 14px 0 4px; font-size: 26px; font-weight: 800; letter-spacing: -.04em; }
    .hero .menu-line { margin: 0; color: var(--muted); font-weight: 600; }
    .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; }
    .fact { padding: 11px 8px; border-radius: 12px; background: var(--chip); text-align: center; }
    .fact strong, .fact span { display: block; }
    .fact strong { font-size: 14px; }
    .fact span { margin-top: 2px; color: var(--muted); font-size: 11px; }
    .go-map { width: 100%; margin-top: 15px; padding: 13px; border: 0; border-radius: 14px; color: var(--beige-ink); background: var(--beige); font-weight: 700; font-size: 14.5px; cursor: pointer; }
    .re-pick { width: 100%; margin-top: 9px; padding: 12px; border: 0; border-radius: 14px; background: var(--chip); color: var(--beige); font-weight: 600; font-size: 13.5px; cursor: pointer; }
    .re-pick:disabled { opacity: .55; cursor: default; }
    #explore-req { width: 100%; margin-top: 13px; padding: 12px; border: 0; border-radius: 14px; background: var(--blue); color: #fff; font-weight: 700; cursor: pointer; }
    #explore-req:disabled { opacity: .6; }
    .slot-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
    .slot-tab { padding: 8px 13px; border: 0; border-radius: 999px; background: var(--card); color: var(--muted); font-size: 13px; font-weight: 600; cursor: pointer; }
    .slot-tab.on { background: var(--beige); color: var(--beige-ink); font-weight: 700; }

    /* ── 상세 + 리뷰 ── */
    .detail h3 { margin: 5px 0 2px; font-size: 19px; letter-spacing: -.03em; }
    .detail .detail-menu { margin: 0; color: var(--muted); font-weight: 600; font-size: 13.5px; }
    .menus-list { margin: 12px 0 0; display: grid; gap: 6px; }
    .menus-list .mi { display: flex; justify-content: space-between; gap: 10px; padding: 9px 12px; border-radius: 10px; background: var(--chip); font-size: 13px; }
    .menus-list .mi b { font-weight: 600; }
    .menus-list .mi span { color: var(--muted); font-variant-numeric: tabular-nums; }
    .detail-note { margin: 12px 0 0; padding-top: 11px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12.5px; line-height: 1.55; }
    .detail-links { display: flex; gap: 14px; margin-top: 11px; }
    .detail-tel { color: var(--beige); font-weight: 700; font-size: 13px; text-decoration: none; }
    .detail-naver { color: #03c75a; font-weight: 700; font-size: 13px; text-decoration: none; }
    .visits { margin-top: 13px; display: grid; gap: 7px; }
    .visits-avg { display: flex; align-items: baseline; gap: 7px; margin: 2px 2px 0; font-weight: 800; font-size: 15px; color: var(--star); }
    .visits-avg small { color: var(--muted); font-weight: 600; font-size: 11.5px; }
    .visit { padding: 10px 12px; border-radius: 10px; background: var(--chip); font-size: 12.5px; line-height: 1.5; }
    .visit b { color: var(--star); margin-right: 6px; }
    .visit small { color: var(--muted); margin-left: 6px; }
    .visit .v-who { display: inline-block; margin-right: 7px; padding: 1px 8px; border-radius: 999px; background: #48484a; color: #fff; font-size: 10.5px; font-weight: 700; }
    .visit .v-who.me { background: var(--beige); color: var(--beige-ink); }
    .visit-btn { margin-top: 14px; width: 100%; padding: 12px; border: 0; border-radius: 14px; color: var(--beige); background: var(--chip); font-weight: 600; cursor: pointer; }
    .visit-form { margin-top: 12px; padding: 14px; border-radius: 16px; background: #1c1c1e; display: grid; gap: 9px; }
    .star-row { display: flex; align-items: center; gap: 2px; }
    .star { border: 0; background: none; padding: 5px 3px; font-size: 36px; line-height: 1; color: #6e6e73; cursor: pointer; transition: color .1s, transform .1s; }
    .star.on { color: var(--star); }
    .star.half { background: linear-gradient(90deg, #ffd60a 50%, #6e6e73 50%); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .star-label { margin-left: 8px; font-size: 12px; color: var(--muted); font-weight: 700; }
    .visit-form textarea { border: 0; border-radius: 10px; padding: 10px 11px; font-size: 13px; resize: vertical; min-height: 52px; font-family: inherit; background: var(--chip); color: var(--ink); }
    .visit-form textarea:focus { outline: 1.5px solid #8d9db3; }
    .visit-save { padding: 12px; border: 0; border-radius: 12px; background: var(--beige); color: var(--beige-ink); font-weight: 700; cursor: pointer; }

    /* ── 다녀온 곳 ── */
    .visited-box .vb-title { display: flex; align-items: center; gap: 7px; margin: 0 2px 11px; font-size: 14px; }
    .visited-box .vb-title .n { display: inline-grid; place-items: center; min-width: 21px; height: 21px; padding: 0 6px; border-radius: 999px; background: var(--blue); color: #fff; font-size: 11.5px; font-weight: 800; }
    .visit-card { position: relative; width: 100%; display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
      padding: 13px 15px; border: 0; border-radius: 14px; background: var(--chip); cursor: pointer; text-align: left; color: var(--ink); }
    .visit-card .v-stars { color: var(--star); font-size: 15px; letter-spacing: 1px; }
    .visit-card .v-name { font-size: 14px; font-weight: 800; margin-top: 2px; }
    .visit-card .v-meta { color: var(--muted); font-size: 11.5px; line-height: 1.4; }
    .empty-note { padding: 14px; border-radius: 14px; background: var(--chip); color: var(--muted); font-size: 12.5px; line-height: 1.55; }
    .list { display: grid; gap: 9px; }

    /* ── 지도 오버레이 ── */
    .kpopup { position: relative; width: 220px; padding: 14px 16px 13px; background: #fff; border-radius: 16px; box-shadow: 0 14px 40px rgba(41,34,25,.28); font-size: 13px; color: #191f28; white-space: normal; word-break: keep-all; }
    .kpopup::after { content: ''; position: absolute; left: 50%; bottom: -7px; width: 15px; height: 15px; background: #fff; transform: translateX(-50%) rotate(45deg); border-radius: 3px; }
    .popup-kicker { color: #a4835a; font-size: 11px; font-weight: 800; }
    .popup-title { margin: 4px 0; font-size: 16px; font-weight: 800; }
    .popup-copy { margin: 0; color: #6b7684; line-height: 1.5; font-size: 12px; }
    .pin { width: 44px; height: 44px; display: grid; place-items: center; border: 4px solid #fff; border-radius: 50% 50% 50% 8px; color: var(--beige-ink); background: var(--beige); box-shadow: 0 7px 18px rgba(41,34,25,.3); transform: rotate(-45deg); font-size: 19px; }
    .pin span { transform: rotate(45deg); }
    .me-pin { width: 28px; height: 28px; display: grid; place-items: center; border: 3px solid #ece1cb; border-radius: 50%; color: #ece1cb; background: #2b2416; box-shadow: 0 4px 12px rgba(0,0,0,.35); font-size: 11px; font-weight: 900; }
    .spin { display: inline-block; width: 15px; height: 15px; border: 2px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: sp 1s linear infinite; vertical-align: -2px; }
    @keyframes sp { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="wiz-prog hidden" id="wiz-prog"><i id="wiz-bar"></i></div>
  <header class="topbar">
    <h1>🍚 점빵이 <span class="beta">BETA</span></h1>
    <span class="who" id="who"></span>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=e5a99ebf63e22edde31aa748643ad249&libraries=services"></script>
  <script>
    // ═══ 점빵이 베타 v2 — 카카오 로그인 + Supabase 계정 저장 ═══
    const SB_URL = 'https://wbtgaydqpupxgmwmxbdv.supabase.co';
    const SB_KEY = 'sb_publishable_kZD_r_s3lca-tdu8NqABnA_WVgHWKBo';
    const KAKAO_JS_KEY = 'e5a99ebf63e22edde31aa748643ad249';
    const SITE = location.origin + location.pathname;
    const sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { flowType: 'pkce', detectSessionInUrl: true } });
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const $ = id => document.getElementById(id);

    // ── 시간대: 시각 입력 → 자동 분류 (기획 확정 경계)
    const SLOTS = {
      breakfast: { label: '아침', emoji: '🌅' },
      lunch: { label: '점심', emoji: '🌤️' },
      dinner: { label: '저녁', emoji: '🌙' },
      latenight: { label: '야식', emoji: '🌃' }
    };
    function slotOf(hhmm) {
      const [h, m] = String(hhmm).split(':').map(Number);
      const t = h * 60 + m;
      if (t >= 300 && t < 630) return 'breakfast';   // 05:00–10:30
      if (t >= 630 && t < 900) return 'lunch';       // 10:30–15:00
      if (t >= 900 && t < 1260) return 'dinner';     // 15:00–21:00
      return 'latenight';                            // 21:00–05:00
    }

    // ── 지도
    const map = new kakao.maps.Map($('map'), { center: new kakao.maps.LatLng(37.5665, 126.9780), level: 8 });
    map.addControl(new kakao.maps.ZoomControl(), kakao.maps.ControlPosition.BOTTOMRIGHT);
    let radiusCircle = null, myOv = null, pinOv = null;
    const popupOv = new kakao.maps.CustomOverlay({ yAnchor: 1.35, zIndex: 30 });
    kakao.maps.event.addListener(map, 'click', () => popupOv.setMap(null));
    function applySpotToMap(spot) {
      if (radiusCircle) radiusCircle.setMap(null);
      if (myOv) myOv.setMap(null);
      if (!spot) return;
      radiusCircle = new kakao.maps.Circle({
        map, center: new kakao.maps.LatLng(spot.lat, spot.lng), radius: spot.radius_m,
        strokeWeight: 2, strokeColor: '#2b2416', strokeOpacity: .5, strokeStyle: 'shortdash',
        fillColor: '#ece1cb', fillOpacity: .1
      });
      const el = document.createElement('div');
      el.className = 'me-pin'; el.textContent = '나'; el.title = spot.name;
      myOv = new kakao.maps.CustomOverlay({ map, position: new kakao.maps.LatLng(spot.lat, spot.lng), content: el, yAnchor: .5, zIndex: 6 });
      map.setLevel(spot.radius_m > 5000 ? 8 : spot.radius_m > 2500 ? 7 : spot.radius_m > 1200 ? 6 : 5);
      map.setCenter(new kakao.maps.LatLng(spot.lat, spot.lng));
      $('map-note').textContent = `${spot.name} ${spot.radius_label} 맛지도`;
    }
    function showPin(place) {
      if (pinOv) pinOv.setMap(null);
      if (!place) return;
      const el = document.createElement('div');
      el.className = 'pin'; el.innerHTML = '<span>🍚</span>';
      el.addEventListener('click', () => openPopup(place));
      pinOv = new kakao.maps.CustomOverlay({ map, position: new kakao.maps.LatLng(place.lat, place.lng), content: el, yAnchor: .9, zIndex: 20 });
    }
    function openPopup(p) {
      const el = document.createElement('div');
      el.className = 'kpopup';
      el.innerHTML = `<div class="popup-kicker">${esc(p.category)}</div>
        <div class="popup-title">${esc(p.name)}</div>
        <p class="popup-copy">${esc(p.menu)} · ${(p.price || 0).toLocaleString()}원<br>${esc(p.hours)}</p>`;
      popupOv.setContent(el);
      popupOv.setPosition(new kakao.maps.LatLng(p.lat, p.lng));
      popupOv.setMap(map);
    }
    function distM(aLat, aLng, bLat, bLng) {
      const R = 6371000, rad = x => x * Math.PI / 180;
      const h = Math.sin(rad(bLat - aLat) / 2) ** 2 + Math.cos(rad(aLat)) * Math.cos(rad(bLat)) * Math.sin(rad(bLng - aLng) / 2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(h));
    }
    const walkText = m => { const min = Math.max(1, Math.round(m / 80)); return min <= 40 ? `도보 약 ${min}분` : `약 ${(m / 1000).toFixed(1)}km`; };

    // ── 카카오 로그인 — Supabase 표준 OAuth 흐름 (비즈앱 전환으로 이메일 scope 사용 가능)
    async function kakaoLogin() {
      const { error } = await sb.auth.signInWithOAuth({ provider: 'kakao', options: { redirectTo: SITE } });
      if (error) alert('카카오 로그인 시작 실패: ' + error.message);
    }

    // ── 상태
    let me = null;          // { id, nickname }
    let spots = [];         // DB spots
    let places = [];        // DB places
    let reviews = [];       // DB reviews (전체)
    let nickById = {};      // user_id → nickname
    let skips = [];         // 오늘 내 스킵 (picks)
    let currentSlotKey = null;
    let currentPick = null;

    const myReview = pid => reviews.find(r => r.place_id === pid && r.user_id === me?.id);
    const placeReviews = pid => reviews.filter(r => r.place_id === pid).sort((a, b) => b.updated_at.localeCompare(a.updated_at));
    const avgOf = pid => { const rs = placeReviews(pid); return rs.length ? rs.reduce((s, r) => s + Number(r.rate), 0) / rs.length : 0; };

    // ── 활성 장소·슬롯
    function activeSpot() {
      if (!spots.length) return null;
      const wd = new Date().getDay();
      const isWknd = wd === 0 || wd === 6;
      return spots.find(s => s.days === (isWknd ? 'weekend' : 'weekday'))
          || spots.find(s => s.days === 'custom' && (s.custom_days || []).includes(wd))
          || spots.find(s => s.days === 'always')
          || spots[0];
    }
    function displaySlot(spot) {
      const mts = (spot.meal_times || []).slice().sort((a, b) => a.time.localeCompare(b.time));
      if (!mts.length) return null;
      const now = new Date();
      const nowMin = now.getHours() * 60 + now.getMinutes();
      // 지금이 속한 슬롯이 등록돼 있으면 그것, 아니면 다음 예정, 다 지났으면 마지막
      const nowSlot = slotOf(`${now.getHours()}:${now.getMinutes()}`);
      const exact = mts.find(m => m.slot === nowSlot);
      if (exact) return exact;
      const upcoming = mts.find(m => { const [h, mi] = m.time.split(':').map(Number); return h * 60 + mi >= nowMin; });
      return upcoming || mts[mts.length - 1];
    }

    // ── 추천 산출: 반경 + 슬롯 + 스킵 제외 + 안 가본 곳 우선 + 평점 가중, 날짜 시드 고정
    function computePick(spot, slotKey) {
      const skippedIds = skips.filter(k => k.slot === slotKey).map(k => k.place_id);
      const cands = places.filter(p =>
        distM(spot.lat, spot.lng, p.lat, p.lng) <= spot.radius_m &&
        (p.slots || []).includes(slotKey) &&
        !skippedIds.includes(p.id));
      if (!cands.length) return null;
      const fresh = cands.filter(p => !myReview(p.id));
      const ranked = (fresh.length ? fresh : cands).slice()
        .sort((a, b) => (avgOf(b.id) - avgOf(a.id)) || (distM(spot.lat, spot.lng, a.lat, a.lng) - distM(spot.lat, spot.lng, b.lat, b.lng)));
      const top = ranked.slice(0, Math.min(3, ranked.length));
      const seedStr = new Date().toISOString().slice(0, 10) + slotKey + me.id;
      const seed = [...seedStr].reduce((s, c) => s + c.charCodeAt(0), 0);
      return top[seed % top.length];
    }

    // ── 홈 렌더
    function renderHome() {
      const spot = activeSpot();
      if (!spot) { openWizard(false); return; }
      applySpotToMap(spot);
      $('wiz-view').classList.add('hidden');
      const mt = displaySlot(spot);
      currentSlotKey = mt ? mt.slot : 'dinner';
      renderSlotBar(spot);
      currentPick = computePick(spot, currentSlotKey);
      renderHero(spot, mt);
      if (currentPick) { renderDetail(currentPick, spot); showPin(currentPick); }
      else { $('detail').classList.add('hidden'); showPin(null); }
      renderVisited();
    }
    function renderSlotBar(spot) {
      const bar = $('slot-bar');
      const mts = (spot.meal_times || []).slice().sort((a, b) => a.time.localeCompare(b.time));
      if (mts.length <= 1) { bar.classList.add('hidden'); return; }
      bar.classList.remove('hidden');
      bar.className = 'slot-tabs';
      bar.innerHTML = mts.map(m =>
        `<button type="button" class="slot-tab ${m.slot === currentSlotKey ? 'on' : ''}" data-slot="${m.slot}">${SLOTS[m.slot].emoji} ${SLOTS[m.slot].label} ${m.time}</button>`).join('');
      bar.querySelectorAll('.slot-tab').forEach(b => b.addEventListener('click', () => {
        currentSlotKey = b.dataset.slot;
        const spot2 = activeSpot();
        currentPick = computePick(spot2, currentSlotKey);
        renderSlotBar(spot2);
        renderHero(spot2, (spot2.meal_times || []).find(m => m.slot === currentSlotKey));
        if (currentPick) { renderDetail(currentPick, spot2); showPin(currentPick); }
        else { $('detail').classList.add('hidden'); showPin(null); }
      }));
    }
    function renderHero(spot, mt) {
      const hero = $('hero');
      hero.classList.remove('hidden');
      const slotName = SLOTS[currentSlotKey].label;
      const skipCount = skips.filter(k => k.slot === currentSlotKey).length;
      if (!currentPick) {
        hero.innerHTML = `
          <div class="hero-top"><span class="badge">오늘의 ${slotName}</span><small class="muted">${esc(spot.name)} · ${esc(spot.radius_label)}</small></div>
          <h2>${skipCount ? '오늘 추천을 다 봤어요' : '이 동네는 아직이에요'}</h2>
          <p class="menu-line">${skipCount ? `${slotName} 추천은 하루 3곳까지예요 — 내일 새로운 곳으로 다시 골라둘게요` : '반경 안에 이 시간대 식당이 없어요'}</p>
          ${skipCount ? '' : `<button type="button" id="explore-req">🔎 이 동네 발굴 요청하기</button>`}`;
        $('explore-req')?.addEventListener('click', async ev => {
          ev.target.disabled = true;
          ev.target.textContent = '접수 중…';
          await sb.from('explore_requests').insert({ user_id: me.id, lat: spot.lat, lng: spot.lng, radius_m: spot.radius_m, slot: currentSlotKey, note: spot.name });
          ev.target.textContent = '접수됐어요 — 준비되면 채워둘게요';
        });
        return;
      }
      const p = currentPick;
      const d = distM(spot.lat, spot.lng, p.lat, p.lng);
      const avg = avgOf(p.id);
      hero.innerHTML = `
        <div class="hero-top"><span class="badge">오늘의 ${slotName}${mt ? ' · ' + mt.time : ''}</span><small class="muted">${esc(spot.name)} · ${esc(spot.radius_label)}</small></div>
        <h2>${esc(p.name)}</h2>
        <p class="menu-line">${esc(p.menu)} · ${(p.price || 0).toLocaleString()}원</p>
        <div class="facts">
          <div class="fact"><strong>${walkText(d)}</strong><span>${esc(spot.name)}에서</span></div>
          <div class="fact"><strong>${esc(p.category)}</strong><span>분류</span></div>
          <div class="fact"><strong>${avg ? '★' + avg.toFixed(1) : '첫 개척'}</strong><span>${avg ? '리뷰 ' + placeReviews(p.id).length + '개' : '아직 리뷰 없음'}</span></div>
        </div>
        <button type="button" class="go-map">지도에서 보기</button>
        <button type="button" class="re-pick" ${skipCount >= 2 ? 'disabled' : ''}>${skipCount >= 2 ? '오늘 스킵을 다 썼어요' : `👀 다른 곳 볼래요 (${2 - skipCount}번 남음)`}</button>`;
      hero.querySelector('.go-map').addEventListener('click', () => {
        map.panTo(new kakao.maps.LatLng(p.lat, p.lng));
        if (map.getLevel() > 4) map.setLevel(4);
        openPopup(p);
        document.querySelector('#map-wrap').scrollIntoView({ behavior: 'smooth' });
      });
      hero.querySelector('.re-pick').addEventListener('click', async ev => {
        if (ev.target.disabled) return;
        ev.target.disabled = true;
        await sb.from('picks').insert({ user_id: me.id, slot: currentSlotKey, place_id: p.id, status: 'skipped' });
        skips.push({ slot: currentSlotKey, place_id: p.id });
        renderHome();
      });
    }

    // ── 상세 + 리뷰
    function renderDetail(p, spot) {
      const panel = $('detail');
      panel.classList.remove('hidden');
      const menus = Array.isArray(p.menus) ? p.menus : [];
      panel.innerHTML = `
        <div class="kicker">${esc(p.category)}${p.description ? ' · ' + esc(p.description) : ''}</div>
        <h3>${esc(p.name)}</h3>
        <p class="detail-menu">${esc(p.menu)} · ${(p.price || 0).toLocaleString()}원</p>
        ${menus.length ? `<div class="menus-list">${menus.map(m => `<div class="mi"><b>${esc(m.name)}</b><span>${(m.price || 0).toLocaleString()}원</span></div>`).join('')}</div>` : ''}
        <p class="detail-note">🕐 ${esc(p.hours)}${p.note ? '<br>' + esc(p.note) : ''}</p>
        <div class="detail-links">
          ${p.tel ? `<a class="detail-tel" href="tel:${p.tel.replace(/-/g, '')}">📞 ${p.tel}</a>` : ''}
          <a class="detail-naver" href="https://map.naver.com/p/search/${encodeURIComponent(p.name)}" target="_blank" rel="noopener">🗺 네이버지도</a>
        </div>
        ${renderReviews(p.id)}
        <button type="button" class="visit-btn" id="visit-btn">🍚 다녀왔어요 — 리뷰 남기기</button>
        <div class="visit-form hidden" id="visit-form">
          <div class="star-row">
            ${[1, 2, 3, 4, 5].map(v => `<button type="button" class="star" data-v="${v}">★</button>`).join('')}
            <span class="star-label" id="star-label">별점을 골라주세요</span>
          </div>
          <textarea id="visit-comment" placeholder="짧은 감상평 (선택)"></textarea>
          <button type="button" class="visit-save" id="visit-save">기록하기</button>
        </div>`;
      wireReviewForm(p);
    }
    function renderReviews(pid) {
      const rows = placeReviews(pid);
      if (!rows.length) return '';
      return `<div class="visits">
        <div class="visits-avg">★ ${avgOf(pid).toFixed(1)}<small>리뷰 ${rows.length}개</small></div>
        ${rows.map(r => {
          const mine = r.user_id === me.id;
          const who = nickById[r.user_id] || '익명';
          return `<div class="visit"><span class="v-who${mine ? ' me' : ''}">${esc(who)}</span><b>${starText(r.rate)}</b>${r.comment ? ' · ' + esc(r.comment) : ''}<small>${r.visited_on}</small></div>`;
        }).join('')}</div>`;
    }
    const STAR_WORDS = { 1: '별로였어요', 2: '아쉬워요', 3: '보통', 4: '좋았어요', 5: '또 가고 싶다!' };
    function starText(r) {
      const full = Math.floor(r), half = r % 1 >= 0.5;
      return '★'.repeat(full) + (half ? '½' : '') + '☆'.repeat(5 - full - (half ? 1 : 0));
    }
    function wireReviewForm(p) {
      const form = $('visit-form');
      $('visit-btn').addEventListener('click', () => form.classList.toggle('hidden'));
      let rate = 0;
      const stars = [...form.querySelectorAll('.star')];
      stars.forEach(b => b.addEventListener('click', e => {
        const rect = b.getBoundingClientRect();
        rate = Number(b.dataset.v) - ((e.clientX - rect.left) < rect.width / 2 ? 0.5 : 0);
        stars.forEach(el => {
          const v = Number(el.dataset.v);
          el.classList.toggle('on', rate >= v);
          el.classList.toggle('half', rate >= v - 0.5 && rate < v);
        });
        $('star-label').textContent = `${rate}점 · ${STAR_WORDS[Math.max(1, Math.round(rate))]}`;
      }));
      $('visit-save').addEventListener('click', async () => {
        if (!rate) { alert('별점을 골라주세요!'); return; }
        const btn = $('visit-save');
        btn.disabled = true; btn.innerHTML = '<span class="spin"></span>';
        const rec = { place_id: p.id, user_id: me.id, rate, comment: $('visit-comment').value.trim().slice(0, 200), visited_on: new Date().toISOString().slice(0, 10), updated_at: new Date().toISOString() };
        const { error } = await sb.from('reviews').upsert(rec, { onConflict: 'place_id,user_id' });
        if (error) { alert('저장 실패: ' + error.message); btn.disabled = false; btn.textContent = '기록하기'; return; }
        await loadReviews();
        renderDetail(p, activeSpot());
        renderVisited();
      });
    }
    function renderVisited() {
      const box = $('visited-box');
      box.classList.remove('hidden');
      const wrap = $('visited-list');
      const mine = reviews.filter(r => r.user_id === me.id).sort((a, b) => b.updated_at.localeCompare(a.updated_at));
      $('visited-count').textContent = mine.length;
      if (!mine.length) { wrap.innerHTML = '<div class="empty-note">아직 기록이 없어요. 추천받은 곳에 다녀오면 리뷰를 남겨보세요.</div>'; return; }
      wrap.innerHTML = mine.map(r => {
        const p = places.find(x => x.id === r.place_id);
        return `<button type="button" class="visit-card" data-id="${esc(r.place_id)}">
          <span class="v-stars">${starText(r.rate)}</span>
          <strong class="v-name">${esc(p ? p.name : r.place_id)}</strong>
          <span class="v-meta">${esc(r.comment || (p ? p.menu : ''))} · ${r.visited_on}</span></button>`;
      }).join('');
      wrap.querySelectorAll('.visit-card').forEach(b => b.addEventListener('click', () => {
        const p = places.find(x => x.id === b.dataset.id);
        if (p) { renderDetail(p, activeSpot()); showPin(p); openPopup(p); }
      }));
    }

    // ── 온보딩 위저드 — ①지도 핀 ②동네 이름 ③반경 ④요일·시각
    const RAD_OPTS = [
      { short: '5분',  label: '도보 5분',  cap: '도보 5분 · 약 400m',   m: 400 },
      { short: '10분', label: '도보 10분', cap: '도보 10분 · 약 800m',  m: 800 },
      { short: '15분', label: '도보 15분', cap: '도보 15분 · 약 1.2km', m: 1200 },
      { short: '3km',  label: '3km',      cap: '차로 3km',            m: 3000 },
      { short: '5km',  label: '5km',      cap: '차로 5km',            m: 5000 }
    ];
    const DAY_OPTS = [{ label: '평일', v: 'weekday' }, { label: '주말', v: 'weekend' }, { label: '매일', v: 'always' }];
    const BACK_SVG = `<svg viewBox="0 0 13 13" fill="currentColor" aria-hidden="true">
        <rect x="1" y="6" width="1" height="1"/><rect x="2" y="5" width="1" height="1"/><rect x="2" y="7" width="1" height="1"/>
        <rect x="3" y="4" width="1" height="1"/><rect x="3" y="8" width="1" height="1"/><rect x="4" y="3" width="1" height="1"/>
        <rect x="4" y="9" width="1" height="1"/><rect x="2" y="6" width="10" height="1"/></svg>`;

    let draft = null, editIdx = 0, wizStep = 1, isEdit = false;
    let setupCircle = null, geocoder = null, pinMoveTimer = null, mapBusy = false, geoTried = false;
    function relayoutKeep() {
      const keep = map.getCenter();
      mapBusy = true;
      map.relayout();
      map.setCenter(keep);
      setTimeout(() => { map.setCenter(keep); mapBusy = false; }, 220);
    }

    const nearestRad = m => RAD_OPTS.reduce((a, b) => Math.abs(b.m - m) < Math.abs(a.m - m) ? b : a);

    function openWizard(edit) {
      isEdit = !!edit;
      draft = spots.length
        ? spots.map(s => ({ ...s, meal_times: (s.meal_times || []).map(m => ({ ...m })) }))
        : [{ name: '', lat: null, lng: null, radius_m: 800, radius_label: '도보 10분', days: 'always', meal_times: [] }];
      editIdx = 0;
      wizStep = 1;
      ['slot-bar', 'hero', 'detail', 'visited-box'].forEach(id => $(id).classList.add('hidden'));
      $('wiz-view').classList.remove('hidden');
      $('wiz-prog').classList.remove('hidden');
      document.body.classList.add('setup-mode');
      if (pinOv) pinOv.setMap(null);
      if (radiusCircle) radiusCircle.setMap(null);
      if (myOv) myOv.setMap(null);
      popupOv.setMap(null);
      $('map-note').classList.add('hidden');
      renderWizard();
    }
    function closeWizard() {
      document.body.classList.remove('setup-mode', 'no-map');
      $('wiz-view').classList.add('hidden');
      $('wiz-prog').classList.add('hidden');
      $('center-pin').classList.add('hidden');
      $('map-cap').classList.add('hidden');
      $('map-note').classList.remove('hidden');
      if (setupCircle) { setupCircle.setMap(null); setupCircle = null; }
      relayoutKeep();
    }

    function renderWizard() {
      const s = draft[editIdx];
      const needMap = wizStep === 1 || wizStep === 3;
      document.body.classList.toggle('no-map', !needMap);
      $('wiz-bar').style.width = (wizStep * 25) + '%';
      $('center-pin').classList.toggle('hidden', wizStep !== 1);
      $('map-cap').classList.toggle('hidden', !needMap);

      const backHidden = wizStep === 1 && !isEdit;
      const head = `<button type="button" class="wiz-back ${backHidden ? 'hide' : ''}" id="wiz-back" aria-label="뒤로">${BACK_SVG}</button>`;
      let html = '', extra = '';

      if (wizStep === 1) {
        html = `${head}
          <h2 class="px"><span class="b">자주 밥 먹는 곳,</span>어디쯤인가요?</h2>
          <p class="wiz-sub">지도를 움직여 핀을 맞춰주세요.</p>`;
      } else if (wizStep === 2) {
        html = `${head}
          <h2 class="px"><span class="b">동네의</span>이름은 무엇인가요?</h2>
          <div class="wiz-body">
            <input class="uline" id="wiz-name" placeholder="회사" maxlength="10" value="${esc(s.name)}">
            <div class="picks" id="wiz-picks">
              ${['회사', '집', '본가', '학교'].map(n => `<button type="button" class="pick ${s.name === n ? 'on' : ''}">${n}</button>`).join('')}
            </div>
            <p class="wiz-hint">나중에 장소를 하나 더 추가하면<br>평일은 회사, 주말은 집처럼 자동으로 바뀌어요.</p>
          </div>`;
      } else if (wizStep === 3) {
        const cur = nearestRad(s.radius_m);
        html = `${head}
          <h2 class="px"><span class="b">여기서부터</span>얼마나 멀리까지?</h2>
          <p class="wiz-sub">이 안에서만 골라드릴게요.</p>`;
        extra = `<div class="seg" id="wiz-rads">
            ${RAD_OPTS.map(o => `<button type="button" class="${o.m === cur.m ? 'on' : ''}" data-m="${o.m}">${o.short}</button>`).join('')}
          </div>`;
      } else {
        const mts = (s.meal_times || []).slice().sort((a, b) => a.time.localeCompare(b.time));
        html = `${head}
          <h2 class="px"><span class="b">언제</span>알려드릴까요?</h2>
          <p class="wiz-sub">시각을 정하면 끼니는 알아서 구분해요.</p>
          <div class="wiz-body">
            <div class="flabel" style="margin-top:0">적용 요일</div>
            <div class="seg" id="wiz-days">
              ${DAY_OPTS.map(o => `<button type="button" class="${s.days === o.v ? 'on' : ''}" data-v="${o.v}">${o.label}</button>`).join('')}
            </div>
            <div class="flabel">추천받을 시각</div>
            <div class="time-row"><input type="time" id="wiz-time" value="12:00"><button type="button" class="time-add" id="wiz-add">추가</button></div>
            <div class="mts" id="wiz-mts">
              ${mts.map((m, i) => `<span class="mt"><span class="emo">${SLOTS[m.slot].emoji}</span> <b>${m.time}</b> ${SLOTS[m.slot].label}
                <button type="button" data-i="${i}">✕</button></span>`).join('')}
            </div>
            <p class="wiz-hint">끼니당 하나씩, 최대 4번까지.<br>아침 · 점심 · 저녁 · 야식은 시각으로 자동 분류돼요.</p>
          </div>`;
      }
      $('wiz-view').innerHTML = html;
      $('wiz-extra').innerHTML = extra;

      const cta = $('wiz-cta');
      cta.textContent = wizStep === 1 ? '여기로 할게요' : wizStep === 4 ? (isEdit ? '저장' : '이대로 시작하기') : '다음';
      cta.disabled = false;
      cta.onclick = () => wizNext();
      $('wiz-back').onclick = () => wizBack();

      wireWizardStep();
      relayoutKeep();
      if (needMap) setTimeout(setupMapForStep, 240);
    }

    function wireWizardStep() {
      const s = draft[editIdx];
      if (wizStep === 2) {
        const nameEl = $('wiz-name');
        setTimeout(() => nameEl.focus(), 80);
        nameEl.addEventListener('input', e => {
          s.name = e.target.value;
          $('wiz-picks').querySelectorAll('.pick').forEach(b => b.classList.toggle('on', b.textContent === s.name));
        });
        $('wiz-picks').querySelectorAll('.pick').forEach(b => b.addEventListener('click', () => {
          s.name = b.textContent;
          nameEl.value = s.name;
          $('wiz-picks').querySelectorAll('.pick').forEach(x => x.classList.toggle('on', x === b));
        }));
      } else if (wizStep === 3) {
        $('wiz-rads').querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
          const opt = RAD_OPTS.find(o => o.m === +b.dataset.m);
          s.radius_m = opt.m;
          s.radius_label = opt.label;
          $('wiz-rads').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
          drawSetupCircle();
        }));
      } else if (wizStep === 4) {
        $('wiz-days').querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
          s.days = b.dataset.v;
          $('wiz-days').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
        }));
        $('wiz-add').addEventListener('click', () => {
          const t = $('wiz-time').value;
          if (!t) return;
          const slot = slotOf(t);
          if (s.meal_times.some(m => m.slot === slot)) {
            alert(`${SLOTS[slot].label} 시간은 이미 있어요 — 끼니별로 하나씩만 정할 수 있어요.`);
            return;
          }
          s.meal_times.push({ time: t, slot });
          s.meal_times.sort((a, b) => a.time.localeCompare(b.time));
          renderWizard();
        });
        $('wiz-mts').querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
          const sorted = s.meal_times.slice().sort((a, b) => a.time.localeCompare(b.time));
          const target = sorted[+b.dataset.i];
          s.meal_times = s.meal_times.filter(m => m !== target);
          renderWizard();
        }));
      }
    }

    // 지도 — 스텝1: 중앙 고정 핀, 스텝3: 반경 원
    function setupMapForStep() {
      const s = draft[editIdx];
      const center = s.lat ? new kakao.maps.LatLng(s.lat, s.lng) : map.getCenter();
      if (s.lat) map.setCenter(center);
      if (wizStep === 1) {
        if (setupCircle) { setupCircle.setMap(null); setupCircle = null; }
        if (map.getLevel() > 5) map.setLevel(4);
        if (!s.lat && !geoTried && navigator.geolocation) {
          geoTried = true;
          $('map-cap').innerHTML = `<span class="emo">📍</span> 현재 위치를 찾는 중…`;
          navigator.geolocation.getCurrentPosition(pos => {
            if (wizStep !== 1 || !draft) return;
            mapBusy = true;
            const here = new kakao.maps.LatLng(pos.coords.latitude, pos.coords.longitude);
            map.setCenter(here);
            map.setLevel(4);
            draft[editIdx].lat = pos.coords.latitude;
            draft[editIdx].lng = pos.coords.longitude;
            setTimeout(() => { mapBusy = false; updatePinCaption(); }, 250);
          }, () => {
            if (!draft[editIdx].lat) { draft[editIdx].lat = center.getLat(); draft[editIdx].lng = center.getLng(); }
            updatePinCaption();
          }, { timeout: 6000, maximumAge: 300000 });
          return;
        }
        if (!s.lat) { s.lat = center.getLat(); s.lng = center.getLng(); }
        updatePinCaption();
      } else {
        drawSetupCircle();
      }
    }
    function drawSetupCircle() {
      const s = draft[editIdx];
      if (setupCircle) setupCircle.setMap(null);
      setupCircle = new kakao.maps.Circle({
        map, center: new kakao.maps.LatLng(s.lat, s.lng), radius: s.radius_m,
        strokeWeight: 2, strokeColor: '#2b2416', strokeOpacity: .5, strokeStyle: 'shortdash',
        fillColor: '#ece1cb', fillOpacity: .22
      });
      const b = setupCircle.getBounds();
      mapBusy = true;
      if (b) map.setBounds(b, 28, 28, 28, 28);
      else map.setCenter(new kakao.maps.LatLng(s.lat, s.lng));
      setTimeout(() => { mapBusy = false; }, 240);
      const opt = nearestRad(s.radius_m);
      $('map-cap').innerHTML = `<span class="emo">${s.radius_m <= 1600 ? '🚶' : '🚗'}</span> ${opt.cap}`;
    }
    function updatePinCaption() {
      const s = draft[editIdx];
      $('map-cap').innerHTML = `<span class="emo">📍</span> 위치를 확인하는 중…`;
      if (!geocoder && kakao.maps.services) geocoder = new kakao.maps.services.Geocoder();
      if (!geocoder) { $('map-cap').innerHTML = `<span class="emo">📍</span> ${s.lat.toFixed(5)}, ${s.lng.toFixed(5)}`; return; }
      geocoder.coord2Address(s.lng, s.lat, (res, status) => {
        if (status === kakao.maps.services.Status.OK && res[0]) {
          const a = res[0].road_address || res[0].address;
          $('map-cap').innerHTML = `<span class="emo">📍</span> ${esc(a.address_name)}`;
        } else {
          $('map-cap').innerHTML = `<span class="emo">📍</span> ${s.lat.toFixed(5)}, ${s.lng.toFixed(5)}`;
        }
      });
    }
    kakao.maps.event.addListener(map, 'center_changed', () => {
      if (mapBusy || !document.body.classList.contains('setup-mode') || wizStep !== 1 || !draft) return;
      const c = map.getCenter();
      draft[editIdx].lat = c.getLat();
      draft[editIdx].lng = c.getLng();
      clearTimeout(pinMoveTimer);
      pinMoveTimer = setTimeout(updatePinCaption, 450);
    });

    function wizBack() {
      if (wizStep === 1) { if (isEdit) { closeWizard(); renderHome(); } return; }
      wizStep--;
      renderWizard();
    }
    async function wizNext() {
      const s = draft[editIdx];
      if (wizStep === 2 && !s.name.trim()) { alert('동네 이름을 정해주세요.'); return; }
      if (wizStep < 4) { wizStep++; renderWizard(); return; }
      if (!s.meal_times.length) { alert('추천받을 시각을 최소 1개 정해주세요.'); return; }
      draft.forEach((d, i) => { if (!d.name.trim()) d.name = '장소' + (i + 1); });
      if (draft.some(d => !d.lat)) { alert('위치가 설정되지 않은 장소가 있어요.'); return; }
      const cta = $('wiz-cta');
      cta.disabled = true;
      cta.innerHTML = '<span class="spin"></span> 저장 중…';
      await sb.from('spots').delete().eq('user_id', me.id);
      const { error } = await sb.from('spots').insert(draft.map(d => ({
        user_id: me.id, name: d.name.trim(), lat: d.lat, lng: d.lng,
        radius_m: d.radius_m, radius_label: d.radius_label, days: d.days, meal_times: d.meal_times
      })));
      if (error) {
        cta.disabled = false;
        cta.textContent = isEdit ? '저장' : '이대로 시작하기';
        alert('저장 실패: ' + error.message);
        return;
      }
      closeWizard();
      await loadSpots();
      renderHome();
    }

    // ── 데이터 로드
    async function loadSpots() {
      const { data } = await sb.from('spots').select('*').order('created_at');
      spots = data || [];
    }
    async function loadPlaces() {
      const { data } = await sb.from('places').select('*');
      places = data || [];
    }
    async function loadReviews() {
      const [r1, r2] = await Promise.all([
        sb.from('reviews').select('*'),
        sb.from('profiles').select('id,nickname')
      ]);
      reviews = r1.data || [];
      nickById = Object.fromEntries((r2.data || []).map(p => [p.id, p.nickname]));
    }
    async function loadSkips() {
      const today = new Date().toISOString().slice(0, 10);
      const { data } = await sb.from('picks').select('slot,place_id').eq('pick_date', today).eq('status', 'skipped');
      skips = data || [];
    }

    // ── 닉네임 (첫 로그인)
    async function ensureProfile(user) {
      const { data } = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle();
      if (data) return data;
      const kakaoNick = user.user_metadata?.name || user.user_metadata?.full_name || user.user_metadata?.preferred_username || '';
      while (true) {
        const n = (prompt('점빵이에서 쓸 닉네임을 정해주세요 (리뷰에 표시돼요)', kakaoNick) || '').trim().slice(0, 12);
        if (!n) continue;
        const { data: ins, error } = await sb.from('profiles').insert({ id: user.id, nickname: n }).select().single();
        if (!error) return ins;
        if (String(error.message).includes('duplicate') || error.code === '23505') { alert(`"${n}"은 이미 누가 쓰고 있어요 — 다른 닉네임으로 해주세요.`); continue; }
        alert('프로필 저장 실패: ' + error.message);
        return null;
      }
    }

    // ── 부팅
    function showLogin() {
      document.body.classList.add('login-mode');
      $('login-view').classList.remove('hidden');
      ['wiz-view', 'slot-bar', 'hero', 'detail', 'visited-box'].forEach(id => $(id).classList.add('hidden'));
      closeWizard();
      $('cfg-btn').classList.add('hidden');
      $('logout-btn').classList.add('hidden');
      $('who').textContent = '';
      $('map-note').textContent = '점빵이 베타';
    }
    async function boot() {
      // 리다이렉트로 돌아온 ?code= 는 supabase-js(detectSessionInUrl)가 자동 교환 — URL만 정리
      const { data: { session } } = await sb.auth.getSession();
      if (location.search.includes('code=')) history.replaceState(null, '', location.pathname);
      if (!session) { showLogin(); return; }
      document.body.classList.remove('login-mode');
      map.relayout();
      $('login-view').classList.add('hidden');
      const profile = await ensureProfile(session.user);
      if (!profile) { showLogin(); return; }
      me = { id: session.user.id, nickname: profile.nickname };
      $('who').textContent = profile.nickname;
      $('cfg-btn').classList.remove('hidden');
      $('logout-btn').classList.remove('hidden');
      await Promise.all([loadSpots(), loadPlaces(), loadReviews(), loadSkips()]);
      if (!spots.length) openWizard(false);
      else renderHome();
    }
    $('kakao-login').addEventListener('click', kakaoLogin);
    $('cfg-btn').addEventListener('click', () => openWizard(true));
    $('logout-btn').addEventListener('click', async () => {
      if (!confirm('로그아웃할까요?')) return;
      await sb.auth.signOut();
      me = null;
      showLogin();
    });
    boot();
  </script>
</body>
</html>
